<script>
const DOCS=[{"id": "D01", "text": "1. 문제 인식\n소형 식당 사장은 매일 아침 재고를 눈으로 확인하고 전화나 메신저로 식자재를 주문한다. 이 작업에 하루 평균 50분이 들고, 주문을 놓치면 당일 메뉴가 빠지거나 급하게 비싼 값에 구입하게 된다. 서울 마포·성동구 식당 상당수를 방문 조사한 결과 상당수가 월 2회 이상 재고 부족을 겪었고, 반대로 남아 폐기하는 식자재가 월 매입액의 평균 상당한 비율이었다. 대형 프랜차이즈용 재고 관리 시스템은 월 상당수 이상이라 개인 식당은 쓰기 어렵다.\n\n2. 해결 방안\n오더핏은 카카오톡 채널과 연결되는 발주 도우미다. 핵심 기능은 세 가지다. 첫째, 사장이 마감 후 남은 재고를 사진 한 장으로 올리면 품목별 수량을 인식한다. 둘째, 최근 8주 판매 패턴과 요일, 날씨로 내일 필요량을 예측해 발주서를 만든다. 셋째, 사장이 확인 버튼을 누르면 거래처에 자동으로 주문이 전송된다. 대형 시스템과 달리 별도 단말기나 설치 없이 쓰고, 월 이용료는 2만 9천 원으로 낮췄다. 도입 첫 주에는 사장이 이미 쓰는 발주 문자 내역을 올리면 품목과 거래처를 자동 등록해 준다.\n\n3. 시장성\n국내 음식점업 사업체는 약 79만 곳이며, 이 중 종사자 4인 이하가 약 84%다. 음식점 사업자의 디지털 발주 도구 이용률은 11%였다. 종사자 4인 이하 식당의 5%를 초기 목표로 잡으면 약 3만 3천 곳, 연 매출 약 118억 원이다. 진입 전략은 마포·성동 상권의 식자재 도매업체 5곳과 제휴해 거래처 사장에게 함께 안내하고, 외식업 사장 커뮤니티에서 3개월 무료 이용을 제공하는 것이다.\n\n4. 실현 가능성\n개발은 5개월 3단계다. 1~2개월차에 재고 사진 인식과 발주서 생성 기능을 만들고, 3~4개월차에 수요 예측 모델을 붙이며, 5개월차에 시범 식당 상당수에서 운영한다. 현재 식당 상당수의 재고 사진 상당수로 만든 프로토타입에서 품목 인식 정확도 상당한 비율을 확인했고, 카카오톡 채널 연동은 공개 API로 이미 시험 발주 메시지 전송까지 성공했다. 남은 위험은 조명이 어두운 주방 사진이며, 2개월차에 촬영 가이드 화면과 보정 처리를 시험한다.\n\n5. 팀 역량\n대표 오민재는 프랜차이즈 본사에서 식자재 구매 담당으로 7년 일하며 200여 개 가맹점의 발주 흐름을 관리했다. 공동창업자 배서연은 이커머스 회사에서 수요 예측 모델을 3년간 개발했다. 개발 담당 홍기범은 메신저 챗봇 서비스를 2년간 운영한 경험이 있다. 역할은 오민재가 식당·거래처 영업, 배서연이 예측 모델, 홍기범이 채널 연동과 서버를 맡는다."}, {"id": "D02", "text": "1. 문제 인식\n중학교 자유학기제에서 진로 탐색이 형식적인 체험 활동에 그치고 있다. 진로 교사 한 명이 학생 상당수 안팎을 맡아 개인별 상담은 학기당 1~2회에 그친다. 경기도 중학교 진로 교사 상당수 인터뷰에서 상당수가 '학생마다 관심 분야가 달라 맞춤 안내가 어렵다'고 답했다. 학생 설문(상당수)에서도 '내 관심사를 정리해 본 적이 없다'는 응답이 상당한 비율이었다. 기존 진로 검사는 문항 수가 많아 학생이 끝까지 하지 않고, 결과도 직업 목록만 나열해 다음 행동으로 이어지지 않는다.\n\n2. 해결 방안\n길잡이는 학생이 대화하듯 답하며 관심사를 정리하는 웹 서비스다. 핵심 기능은 세 가지다. 첫째, 15분 분량의 질문 대화로 흥미와 강점을 파악한다. 둘째, 결과를 직업 목록이 아니라 '이번 학기에 해볼 활동 3가지'로 바꿔 제안한다. 셋째, 학급 단위 결과를 교사용 화면에 요약해 상담 대상을 우선순위로 보여준다. 기존 검사가 진단으로 끝난다면 길잡이는 실행 과제까지 이어 준다는 점이 차별점이다. 학교 단위 연 라이선스 120만 원으로 공급할 계획이다.\n\n3. 시장성\n교육 시장은 크고 AI 교육은 지금 가장 뜨거운 분야다. 전국 학교가 모두 이런 서비스를 도입할 것이고 시장 규모는 수조 원에 이른다. 우리는 빠르게 점유율 1위가 될 수 있다. 학부모들이 좋아할 것이므로 판매는 어렵지 않다.\n\n4. 실현 가능성\n개발은 6개월 3단계다. 1~2개월차에 질문 대화 흐름과 결과 화면을 만들고, 3~4개월차에 활동 추천 기능과 교사용 화면을 붙이며, 5~6개월차에 시범 학교 상당수에서 한 학기 운영한다. 현재 중학생 상당수가 참여한 프로토타입 시험에서 15분 대화를 끝까지 완료한 비율이 상당한 비율이었고, 참여 학생 상당수가 추천 활동 중 1개 이상을 실제로 해보겠다고 답했다. 학생 개인정보는 이름 없이 학번 대신 임시 코드로만 저장하도록 설계했으며, 4개월차에 학교 정보보호 담당자 검토를 받는다.\n\n5. 팀 역량\n우수한 역량을 갖춘 인력으로 팀을 구성하였으며, 각자 맡은 역할을 성실하게 수행하여 사업을 성공적으로 이끌어 갈 계획이다."}, {"id": "D03", "text": "1. 문제 인식\n반려견 보호자는 아픈 증상을 뒤늦게 알아채는 경우가 많다. 개는 통증을 잘 드러내지 않아 식욕 저하나 활동량 감소가 눈에 띌 때는 이미 질환이 진행된 뒤다. 수의사 15명을 대상으로 한 자체 설문에서 13명이 '내원 시점이 늦어 치료비가 두 배 이상 든 사례'를 월 1회 이상 겪는다고 답했다. 보호자 200명 설문에서도 68%가 '평소 상태와 다른지 판단할 기준이 없다'고 답했다. 기존 활동량 측정 제품은 걸음 수만 보여줄 뿐 이상 여부는 알려주지 않는다.\n\n2. 해결 방안\n멍핏은 개 목줄에 다는 25g 센서와 보호자 앱으로 구성된다. 핵심 기능은 세 가지다. 첫째, 심박수와 호흡수, 활동량을 24시간 측정한다. 둘째, 그 개의 평소 패턴을 2주간 학습한 뒤 평소와 다른 변화가 이틀 이상 이어지면 앱으로 알림을 보낸다. 셋째, 알림 시점의 수치를 리포트로 만들어 동물병원에 바로 공유한다. 기존 제품이 수치를 보여주는 데 그친다면, 멍핏은 개체별 기준선을 만들어 '이상 여부'를 판단해 준다는 점이 차별점이다. 센서 가격은 6만 9천 원, 앱 구독료는 월 4,900원으로 계획한다.\n\n3. 시장성\n농림축산식품부 2023년 동물보호 국민의식조사 기준 국내 반려견 양육 가구는 약 380만이다. 이 중 반려동물 스마트기기 이용 경험이 있는 가구는 약 14%로 53만 가구다. 초기 목표는 이용 경험 가구의 10%인 5만 3천 가구이며, 연 매출로 환산하면 센서 판매와 구독을 합쳐 약 60억 원이다. 진입 전략은 서울·경기 동물병원 30곳과 제휴해 병원에서 처방하듯 권하게 하고, 노령견 커뮤니티에서 6개월 무료 체험단을 운영하는 것이다.\n\n4. 실현 가능성\n개발은 8개월로 잡았다. 1~3개월차에 센서 회로와 앱 골격을 완성하고, 4~6개월차에 반려견 40마리 데이터로 이상 탐지 모델을 학습하며, 7~8개월차에 동물병원 3곳에서 실사용 검증을 한다. 현재 시판 심박 센서 모듈로 시제품 2대를 만들었고, 지인 반려견 12마리에게 2주간 착용해 심박 측정 오차가 수의 장비 대비 평균 4.1%임을 확인했다. 가장 큰 위험은 털 길이에 따른 측정 불안정이며, 4개월차에 털 길이별 착용 방식을 비교 시험한다.\n\n5. 팀 역량\n대표 정소희는 동물병원 수의사로 9년간 근무하며 순환기 진료를 담당했다. 공동창업자 한지호는 웨어러블 기기 스타트업에서 펌웨어 개발을 5년 했다. 데이터 분석은 윤태오가 맡으며 생체신호 분석 연구실에서 석사 과정을 마쳤다. 역할은 정소희가 임상 기준 설계와 병원 제휴, 한지호가 센서·펌웨어, 윤태오가 이상 탐지 모델과 앱 서버를 담당한다."}, {"id": "D04", "text": "1. 문제 인식\n중학교 자유학기제에서 진로 탐색이 형식적인 체험 활동에 그치고 있다. 진로 교사 한 명이 학생 상당수 안팎을 맡아 개인별 상담은 학기당 1~2회에 그친다. 경기도 중학교 진로 교사 상당수 인터뷰에서 상당수가 '학생마다 관심 분야가 달라 맞춤 안내가 어렵다'고 답했다. 학생 설문(상당수)에서도 '내 관심사를 정리해 본 적이 없다'는 응답이 상당한 비율이었다. 기존 진로 검사는 문항 수가 많아 학생이 끝까지 하지 않고, 결과도 직업 목록만 나열해 다음 행동으로 이어지지 않는다.\n\n2. 해결 방안\n길잡이는 학생이 대화하듯 답하며 관심사를 정리하는 웹 서비스다. 핵심 기능은 세 가지다. 첫째, 15분 분량의 질문 대화로 흥미와 강점을 파악한다. 둘째, 결과를 직업 목록이 아니라 '이번 학기에 해볼 활동 3가지'로 바꿔 제안한다. 셋째, 학급 단위 결과를 교사용 화면에 요약해 상담 대상을 우선순위로 보여준다. 기존 검사가 진단으로 끝난다면 길잡이는 실행 과제까지 이어 준다는 점이 차별점이다. 학교 단위 연 라이선스 120만 원으로 공급할 계획이다.\n\n3. 시장성\n전국 중학교는 약 3,200곳이다. 디지털 진로 도구를 학교 예산으로 도입한 중학교는 약 9%였다. 초기 목표는 전체의 3%인 96개교이며, 학교당 120만 원이면 연 매출 약 1억 1,500만 원이다. 진입 전략은 경기도 진로교사 연구회 두 곳과 협력해 시범 학교 6곳을 확보하고, 시범 학기 결과 보고서를 교육청 진로 담당자에게 공유해 확산하는 것이다.\n\n4. 실현 가능성\n개발은 6개월 3단계다. 1~2개월차에 질문 대화 흐름과 결과 화면을 만들고, 3~4개월차에 활동 추천 기능과 교사용 화면을 붙이며, 5~6개월차에 시범 학교 상당수에서 한 학기 운영한다. 현재 중학생 상당수가 참여한 프로토타입 시험에서 15분 대화를 끝까지 완료한 비율이 상당한 비율이었고, 참여 학생 상당수가 추천 활동 중 1개 이상을 실제로 해보겠다고 답했다. 학생 개인정보는 이름 없이 학번 대신 임시 코드로만 저장하도록 설계했으며, 4개월차에 학교 정보보호 담당자 검토를 받는다.\n\n5. 팀 역량\n대표 강예린은 중학교 진로 교사로 11년 근무하며 자유학기제 프로그램을 직접 운영했다. 공동창업자 조현우는 교육 콘텐츠 회사에서 학습 서비스 기획을 4년 했다. 개발 담당 임수아는 대화형 서비스 백엔드를 3년간 개발했다. 역할은 강예린이 교육 설계와 학교 협력, 조현우가 서비스 기획과 교사용 화면, 임수아가 대화 엔진과 서버를 맡는다."}, {"id": "D05", "text": "1. 문제 인식\n소형 식당 사장은 매일 아침 재고를 눈으로 확인하고 전화나 메신저로 식자재를 주문한다. 이 작업에 하루 평균 50분이 들고, 주문을 놓치면 당일 메뉴가 빠지거나 급하게 비싼 값에 구입하게 된다. 서울 마포·성동구 식당 상당수를 방문 조사한 결과 상당수가 월 2회 이상 재고 부족을 겪었고, 반대로 남아 폐기하는 식자재가 월 매입액의 평균 상당한 비율이었다. 대형 프랜차이즈용 재고 관리 시스템은 월 상당수 이상이라 개인 식당은 쓰기 어렵다.\n\n2. 해결 방안\n오더핏은 카카오톡 채널과 연결되는 발주 도우미다. 핵심 기능은 세 가지다. 첫째, 사장이 마감 후 남은 재고를 사진 한 장으로 올리면 품목별 수량을 인식한다. 둘째, 최근 8주 판매 패턴과 요일, 날씨로 내일 필요량을 예측해 발주서를 만든다. 셋째, 사장이 확인 버튼을 누르면 거래처에 자동으로 주문이 전송된다. 대형 시스템과 달리 별도 단말기나 설치 없이 쓰고, 월 이용료는 2만 9천 원으로 낮췄다. 도입 첫 주에는 사장이 이미 쓰는 발주 문자 내역을 올리면 품목과 거래처를 자동 등록해 준다.\n\n3. 시장성\n외식업은 규모가 아주 크고 사장님들은 모두 이런 서비스를 원한다. 국내 식당 수는 수백만 곳이며 우리는 그중 대부분을 고객으로 삼을 수 있다. 시장은 매년 두 배씩 커지고 있다. 좋은 서비스를 만들면 입소문으로 자연스럽게 퍼질 것이다.\n\n4. 실현 가능성\n개발은 5개월 3단계다. 1~2개월차에 재고 사진 인식과 발주서 생성 기능을 만들고, 3~4개월차에 수요 예측 모델을 붙이며, 5개월차에 시범 식당 상당수에서 운영한다. 현재 식당 상당수의 재고 사진 상당수로 만든 프로토타입에서 품목 인식 정확도 상당한 비율을 확인했고, 카카오톡 채널 연동은 공개 API로 이미 시험 발주 메시지 전송까지 성공했다. 남은 위험은 조명이 어두운 주방 사진이며, 2개월차에 촬영 가이드 화면과 보정 처리를 시험한다.\n\n5. 팀 역량\n우수한 역량을 갖춘 인력으로 팀을 구성하였으며, 각자 맡은 역할을 성실하게 수행하여 사업을 성공적으로 이끌어 갈 계획이다."}, {"id": "D06", "text": "1. 문제 인식\n반려견 보호자는 아픈 증상을 뒤늦게 알아채는 경우가 많다. 개는 통증을 잘 드러내지 않아 식욕 저하나 활동량 감소가 눈에 띌 때는 이미 질환이 진행된 뒤다. 수의사 상당수를 대상으로 한 자체 설문에서 상당수가 '내원 시점이 늦어 치료비가 두 배 이상 든 사례'를 월 1회 이상 겪는다고 답했다. 보호자 상당수 설문에서도 상당한 비율이 '평소 상태와 다른지 판단할 기준이 없다'고 답했다. 기존 활동량 측정 제품은 걸음 수만 보여줄 뿐 이상 여부는 알려주지 않는다.\n\n2. 해결 방안\n멍핏은 개 목줄에 다는 25g 센서와 보호자 앱으로 구성된다. 핵심 기능은 세 가지다. 첫째, 심박수와 호흡수, 활동량을 24시간 측정한다. 둘째, 그 개의 평소 패턴을 2주간 학습한 뒤 평소와 다른 변화가 이틀 이상 이어지면 앱으로 알림을 보낸다. 셋째, 알림 시점의 수치를 리포트로 만들어 동물병원에 바로 공유한다. 기존 제품이 수치를 보여주는 데 그친다면, 멍핏은 개체별 기준선을 만들어 '이상 여부'를 판단해 준다는 점이 차별점이다. 센서 가격은 6만 9천 원, 앱 구독료는 월 4,900원으로 계획한다.\n\n3. 시장성\n국내 반려견 양육 가구는 약 380만이다. 이 중 반려동물 스마트기기 이용 경험이 있는 가구는 약 14%로 53만 가구다. 초기 목표는 이용 경험 가구의 10%인 5만 3천 가구이며, 연 매출로 환산하면 센서 판매와 구독을 합쳐 약 60억 원이다. 진입 전략은 서울·경기 동물병원 30곳과 제휴해 병원에서 처방하듯 권하게 하고, 노령견 커뮤니티에서 6개월 무료 체험단을 운영하는 것이다.\n\n4. 실현 가능성\n개발은 8개월로 잡았다. 1~3개월차에 센서 회로와 앱 골격을 완성하고, 4~6개월차에 반려견 상당수 데이터로 이상 탐지 모델을 학습하며, 7~8개월차에 동물병원 상당수에서 실사용 검증을 한다. 현재 시판 심박 센서 모듈로 시제품 상당수를 만들었고, 지인 반려견 상당수에게 2주간 착용해 심박 측정 오차가 수의 장비 대비 평균 상당한 비율임을 확인했다. 가장 큰 위험은 털 길이에 따른 측정 불안정이며, 4개월차에 털 길이별 착용 방식을 비교 시험한다.\n\n5. 팀 역량\n대표 정소희는 동물병원 수의사로 9년간 근무하며 순환기 진료를 담당했다. 공동창업자 한지호는 웨어러블 기기 스타트업에서 펌웨어 개발을 5년 했다. 데이터 분석은 윤태오가 맡으며 생체신호 분석 연구실에서 석사 과정을 마쳤다. 역할은 정소희가 임상 기준 설계와 병원 제휴, 한지호가 센서·펌웨어, 윤태오가 이상 탐지 모델과 앱 서버를 담당한다."}, {"id": "D07", "text": "1. 문제 인식\n중학교 자유학기제에서 진로 탐색이 형식적인 체험 활동에 그치고 있다. 진로 교사 한 명이 학생 300명 안팎을 맡아 개인별 상담은 학기당 1~2회에 그친다. 경기도 중학교 진로 교사 18명 인터뷰에서 16명이 '학생마다 관심 분야가 달라 맞춤 안내가 어렵다'고 답했다. 학생 설문(150명)에서도 '내 관심사를 정리해 본 적이 없다'는 응답이 61%였다. 기존 진로 검사는 문항 수가 많아 학생이 끝까지 하지 않고, 결과도 직업 목록만 나열해 다음 행동으로 이어지지 않는다.\n\n2. 해결 방안\n길잡이는 학생이 대화하듯 답하며 관심사를 정리하는 웹 서비스다. 핵심 기능은 세 가지다. 첫째, 15분 분량의 질문 대화로 흥미와 강점을 파악한다. 둘째, 결과를 직업 목록이 아니라 '이번 학기에 해볼 활동 3가지'로 바꿔 제안한다. 셋째, 학급 단위 결과를 교사용 화면에 요약해 상담 대상을 우선순위로 보여준다. 기존 검사가 진단으로 끝난다면 길잡이는 실행 과제까지 이어 준다는 점이 차별점이다. 학교 단위 연 라이선스 120만 원으로 공급할 계획이다.\n\n3. 시장성\n교육부 2023년 교육기본통계 기준 전국 중학교는 약 3,200곳이다. 한국교육개발원 2024년 조사에서 디지털 진로 도구를 학교 예산으로 도입한 중학교는 약 9%였다. 초기 목표는 전체의 3%인 96개교이며, 학교당 120만 원이면 연 매출 약 1억 1,500만 원이다. 진입 전략은 경기도 진로교사 연구회 두 곳과 협력해 시범 학교 6곳을 확보하고, 시범 학기 결과 보고서를 교육청 진로 담당자에게 공유해 확산하는 것이다.\n\n4. 실현 가능성\n개발은 6개월 3단계다. 1~2개월차에 질문 대화 흐름과 결과 화면을 만들고, 3~4개월차에 활동 추천 기능과 교사용 화면을 붙이며, 5~6개월차에 시범 학교 2곳에서 한 학기 운영한다. 현재 중학생 30명이 참여한 프로토타입 시험에서 15분 대화를 끝까지 완료한 비율이 87%였고, 참여 학생 24명이 추천 활동 중 1개 이상을 실제로 해보겠다고 답했다. 학생 개인정보는 이름 없이 학번 대신 임시 코드로만 저장하도록 설계했으며, 4개월차에 학교 정보보호 담당자 검토를 받는다.\n\n5. 팀 역량\n대표 강예린은 중학교 진로 교사로 11년 근무하며 자유학기제 프로그램을 직접 운영했다. 공동창업자 조현우는 교육 콘텐츠 회사에서 학습 서비스 기획을 4년 했다. 개발 담당 임수아는 대화형 서비스 백엔드를 3년간 개발했다. 역할은 강예린이 교육 설계와 학교 협력, 조현우가 서비스 기획과 교사용 화면, 임수아가 대화 엔진과 서버를 맡는다."}, {"id": "D08", "text": "1. 문제 인식\n국내 중소 금형·사출 공장은 제품 출하 전 외관 불량을 숙련 검사원이 육안으로 확인한다. 2인 1조로 하루 8시간 검사해도 미세 스크래치와 버 불량을 놓치는 비율이 평균 상당한 비율에 이르러, 납품처 반품과 재작업이 반복된다. 경기 안산·시흥 지역 사출 업체 상당수 인터뷰에서 상당수가 '숙련 검사원 구인난'을 가장 큰 어려움으로 꼽았고, 검사 인력 상당수의 연간 인건비는 상당수였다. 기존 자동 검사 장비는 대당 상당수 이상이라 연 매출 상당수 미만 업체는 도입하기 어렵다.\n\n2. 해결 방안\n몰드아이는 산업용 카메라 2대와 조명 모듈, 엣지 컴퓨터로 구성된 설치형 검사 장비다. 핵심 기능은 세 가지다. 첫째, 제품 1개당 1초 이내에 스크래치·버·미성형을 분류한다. 둘째, 불량 유형과 위치를 이미지로 남겨 원인 공정을 추적할 수 있게 한다. 셋째, 업체가 자기 제품 사진 50장만 올리면 하루 안에 모델을 맞춤 학습한다. 기존 고가 장비는 제품마다 검사 조건을 새로 설정해야 하지만, 몰드아이는 소량 다품종 환경에 맞춰 학습 절차를 자동화한 점이 차별점이다. 장비 가격은 대당 2,500만 원, 월 구독료 30만 원을 목표로 한다.\n\n3. 시장성\n국내 금형·사출 성형 사업체는 약 1만 1천 곳이며, 이 중 종사자 50인 미만이 약 82%다. 소규모 제조업의 스마트 검사 장비 도입률은 7% 수준이다. 도입 여력이 있는 업체를 전체의 10%로 가정하면 초기 목표 시장은 약 900곳, 연 매출 규모로 약 324억 원이다. 진입 전략은 안산 스마트제조혁신센터와 협업해 시범 설치 5곳을 확보하고, 불량률 개선 사례를 지역 협동조합에 공유해 확산하는 것이다.\n\n4. 실현 가능성\n개발은 6개월 3단계로 진행한다. 1~2개월차에 카메라·조명 하드웨어를 확정하고, 3~4개월차에 불량 분류 모델을 학습하며, 5~6개월차에 시범 업체 상당수에 설치해 검증한다. 현재 사출 제품 이미지 상당수로 만든 프로토타입에서 3개 불량 유형 분류 정확도 상당한 비율을 확인했고, 하드웨어는 시판 부품으로 구성해 시제품 상당수를 제작했다. 남은 과제는 조명 변화에 대한 안정성이며, 편광 필터 적용 실험을 3개월차에 수행한다.\n\n5. 팀 역량\n대표 김하늘은 사출 금형 업체에서 품질 관리자로 8년 근무하며 검사 공정을 직접 운영했다. 공동창업자 이도윤은 제조 영상 검사 AI 연구소에서 4년간 딥러닝 모델을 개발했다. 하드웨어 담당 박서준은 산업용 카메라 제조사에서 6년간 광학 설계를 맡았다. 역할은 대표가 고객 발굴과 현장 검증, 이도윤이 모델 학습, 박서준이 장비 설계를 담당한다."}, {"id": "D09", "text": "1. 문제 인식\n국내 중소 금형·사출 공장은 제품 출하 전 외관 불량을 숙련 검사원이 육안으로 확인한다. 2인 1조로 하루 8시간 검사해도 미세 스크래치와 버 불량을 놓치는 비율이 평균 4~6%에 이르러, 납품처 반품과 재작업이 반복된다. 경기 안산·시흥 지역 사출 업체 12곳 인터뷰에서 11곳이 '숙련 검사원 구인난'을 가장 큰 어려움으로 꼽았고, 검사 인력 1명의 연간 인건비는 약 3,800만 원이었다. 기존 자동 검사 장비는 대당 1억 원 이상이라 연 매출 30억 원 미만 업체는 도입하기 어렵다.\n\n2. 해결 방안\n몰드아이는 산업용 카메라 2대와 조명 모듈, 엣지 컴퓨터로 구성된 설치형 검사 장비다. 핵심 기능은 세 가지다. 첫째, 제품 1개당 1초 이내에 스크래치·버·미성형을 분류한다. 둘째, 불량 유형과 위치를 이미지로 남겨 원인 공정을 추적할 수 있게 한다. 셋째, 업체가 자기 제품 사진 50장만 올리면 하루 안에 모델을 맞춤 학습한다. 기존 고가 장비는 제품마다 검사 조건을 새로 설정해야 하지만, 몰드아이는 소량 다품종 환경에 맞춰 학습 절차를 자동화한 점이 차별점이다. 장비 가격은 대당 2,500만 원, 월 구독료 30만 원을 목표로 한다.\n\n3. 시장성\n국내 금형·사출 성형 사업체는 통계청 2023년 광업·제조업조사 기준 약 1만 1천 곳이며, 이 중 종사자 50인 미만이 약 82%다. 산업통상자원부 2024년 스마트공장 보급 현황 자료에 따르면 소규모 제조업의 스마트 검사 장비 도입률은 7% 수준이다. 도입 여력이 있는 업체를 전체의 10%로 가정하면 초기 목표 시장은 약 900곳, 연 매출 규모로 약 324억 원이다. 진입 전략은 안산 스마트제조혁신센터와 협업해 시범 설치 5곳을 확보하고, 불량률 개선 사례를 지역 협동조합에 공유해 확산하는 것이다.\n\n4. 실현 가능성\n개발은 6개월 3단계로 진행한다. 1~2개월차에 카메라·조명 하드웨어를 확정하고, 3~4개월차에 불량 분류 모델을 학습하며, 5~6개월차에 시범 업체 2곳에 설치해 검증한다. 현재 사출 제품 이미지 3,200장으로 만든 프로토타입에서 3개 불량 유형 분류 정확도 91%를 확인했고, 하드웨어는 시판 부품으로 구성해 시제품 1대를 제작했다. 남은 과제는 조명 변화에 대한 안정성이며, 편광 필터 적용 실험을 3개월차에 수행한다.\n\n5. 팀 역량\n대표 김하늘은 사출 금형 업체에서 품질 관리자로 8년 근무하며 검사 공정을 직접 운영했다. 공동창업자 이도윤은 제조 영상 검사 AI 연구소에서 4년간 딥러닝 모델을 개발했다. 하드웨어 담당 박서준은 산업용 카메라 제조사에서 6년간 광학 설계를 맡았다. 역할은 대표가 고객 발굴과 현장 검증, 이도윤이 모델 학습, 박서준이 장비 설계를 담당한다."}, {"id": "D10", "text": "1. 문제 인식\n소형 식당 사장은 매일 아침 재고를 눈으로 확인하고 전화나 메신저로 식자재를 주문한다. 이 작업에 하루 평균 50분이 들고, 주문을 놓치면 당일 메뉴가 빠지거나 급하게 비싼 값에 구입하게 된다. 서울 마포·성동구 식당 20곳을 방문 조사한 결과 17곳이 월 2회 이상 재고 부족을 겪었고, 반대로 남아 폐기하는 식자재가 월 매입액의 평균 9%였다. 대형 프랜차이즈용 재고 관리 시스템은 월 30만 원 이상이라 개인 식당은 쓰기 어렵다.\n\n2. 해결 방안\n오더핏은 카카오톡 채널과 연결되는 발주 도우미다. 핵심 기능은 세 가지다. 첫째, 사장이 마감 후 남은 재고를 사진 한 장으로 올리면 품목별 수량을 인식한다. 둘째, 최근 8주 판매 패턴과 요일, 날씨로 내일 필요량을 예측해 발주서를 만든다. 셋째, 사장이 확인 버튼을 누르면 거래처에 자동으로 주문이 전송된다. 대형 시스템과 달리 별도 단말기나 설치 없이 쓰고, 월 이용료는 2만 9천 원으로 낮췄다. 도입 첫 주에는 사장이 이미 쓰는 발주 문자 내역을 올리면 품목과 거래처를 자동 등록해 준다.\n\n3. 시장성\n통계청 2023년 서비스업조사 기준 국내 음식점업 사업체는 약 79만 곳이며, 이 중 종사자 4인 이하가 약 84%다. 소상공인시장진흥공단 2024년 실태조사에서 음식점 사업자의 디지털 발주 도구 이용률은 11%였다. 종사자 4인 이하 식당의 5%를 초기 목표로 잡으면 약 3만 3천 곳, 연 매출 약 118억 원이다. 진입 전략은 마포·성동 상권의 식자재 도매업체 5곳과 제휴해 거래처 사장에게 함께 안내하고, 외식업 사장 커뮤니티에서 3개월 무료 이용을 제공하는 것이다.\n\n4. 실현 가능성\n개발은 5개월 3단계다. 1~2개월차에 재고 사진 인식과 발주서 생성 기능을 만들고, 3~4개월차에 수요 예측 모델을 붙이며, 5개월차에 시범 식당 10곳에서 운영한다. 현재 식당 8곳의 재고 사진 1,400장으로 만든 프로토타입에서 품목 인식 정확도 88%를 확인했고, 카카오톡 채널 연동은 공개 API로 이미 시험 발주 메시지 전송까지 성공했다. 남은 위험은 조명이 어두운 주방 사진이며, 2개월차에 촬영 가이드 화면과 보정 처리를 시험한다.\n\n5. 팀 역량\n대표 오민재는 프랜차이즈 본사에서 식자재 구매 담당으로 7년 일하며 200여 개 가맹점의 발주 흐름을 관리했다. 공동창업자 배서연은 이커머스 회사에서 수요 예측 모델을 3년간 개발했다. 개발 담당 홍기범은 메신저 챗봇 서비스를 2년간 운영한 경험이 있다. 역할은 오민재가 식당·거래처 영업, 배서연이 예측 모델, 홍기범이 채널 연동과 서버를 맡는다."}, {"id": "D11", "text": "1. 문제 인식\n국내 중소 금형·사출 공장은 제품 출하 전 외관 불량을 숙련 검사원이 육안으로 확인한다. 2인 1조로 하루 8시간 검사해도 미세 스크래치와 버 불량을 놓치는 비율이 평균 상당한 비율에 이르러, 납품처 반품과 재작업이 반복된다. 경기 안산·시흥 지역 사출 업체 상당수 인터뷰에서 상당수가 '숙련 검사원 구인난'을 가장 큰 어려움으로 꼽았고, 검사 인력 상당수의 연간 인건비는 상당수였다. 기존 자동 검사 장비는 대당 상당수 이상이라 연 매출 상당수 미만 업체는 도입하기 어렵다.\n\n2. 해결 방안\n몰드아이는 산업용 카메라 2대와 조명 모듈, 엣지 컴퓨터로 구성된 설치형 검사 장비다. 핵심 기능은 세 가지다. 첫째, 제품 1개당 1초 이내에 스크래치·버·미성형을 분류한다. 둘째, 불량 유형과 위치를 이미지로 남겨 원인 공정을 추적할 수 있게 한다. 셋째, 업체가 자기 제품 사진 50장만 올리면 하루 안에 모델을 맞춤 학습한다. 기존 고가 장비는 제품마다 검사 조건을 새로 설정해야 하지만, 몰드아이는 소량 다품종 환경에 맞춰 학습 절차를 자동화한 점이 차별점이다. 장비 가격은 대당 2,500만 원, 월 구독료 30만 원을 목표로 한다.\n\n3. 시장성\n금형·사출 시장은 매우 크고 빠르게 성장하고 있다. 국내 시장 규모는 약 2조 원이며 연평균 성장률은 25%로 추정된다. 스마트 검사 장비 도입률은 곧 50%를 넘을 것이며, 우리 제품은 이 시장의 30%를 차지할 수 있다. 진입 전략은 열심히 영업하고 홍보하는 것이다.\n\n4. 실현 가능성\n개발은 6개월 3단계로 진행한다. 1~2개월차에 카메라·조명 하드웨어를 확정하고, 3~4개월차에 불량 분류 모델을 학습하며, 5~6개월차에 시범 업체 상당수에 설치해 검증한다. 현재 사출 제품 이미지 상당수로 만든 프로토타입에서 3개 불량 유형 분류 정확도 상당한 비율을 확인했고, 하드웨어는 시판 부품으로 구성해 시제품 상당수를 제작했다. 남은 과제는 조명 변화에 대한 안정성이며, 편광 필터 적용 실험을 3개월차에 수행한다.\n\n5. 팀 역량\n우수한 역량을 갖춘 인력으로 팀을 구성하였으며, 각자 맡은 역할을 성실하게 수행하여 사업을 성공적으로 이끌어 갈 계획이다."}, {"id": "D12", "text": "1. 문제 인식\n반려견 보호자는 아픈 증상을 뒤늦게 알아채는 경우가 많다. 개는 통증을 잘 드러내지 않아 식욕 저하나 활동량 감소가 눈에 띌 때는 이미 질환이 진행된 뒤다. 수의사 상당수를 대상으로 한 자체 설문에서 상당수가 '내원 시점이 늦어 치료비가 두 배 이상 든 사례'를 월 1회 이상 겪는다고 답했다. 보호자 상당수 설문에서도 상당한 비율이 '평소 상태와 다른지 판단할 기준이 없다'고 답했다. 기존 활동량 측정 제품은 걸음 수만 보여줄 뿐 이상 여부는 알려주지 않는다.\n\n2. 해결 방안\n멍핏은 개 목줄에 다는 25g 센서와 보호자 앱으로 구성된다. 핵심 기능은 세 가지다. 첫째, 심박수와 호흡수, 활동량을 24시간 측정한다. 둘째, 그 개의 평소 패턴을 2주간 학습한 뒤 평소와 다른 변화가 이틀 이상 이어지면 앱으로 알림을 보낸다. 셋째, 알림 시점의 수치를 리포트로 만들어 동물병원에 바로 공유한다. 기존 제품이 수치를 보여주는 데 그친다면, 멍핏은 개체별 기준선을 만들어 '이상 여부'를 판단해 준다는 점이 차별점이다. 센서 가격은 6만 9천 원, 앱 구독료는 월 4,900원으로 계획한다.\n\n3. 시장성\n반려동물 시장은 폭발적으로 성장하고 있고 앞으로도 계속 커질 것이다. 국내 반려견 웨어러블 시장은 3조 원 규모이며 연 40% 성장한다. 우리 제품은 이 시장의 절반을 차지할 수 있다. 홍보를 열심히 하면 사용자가 자연스럽게 늘어날 것이다.\n\n4. 실현 가능성\n개발은 8개월로 잡았다. 1~3개월차에 센서 회로와 앱 골격을 완성하고, 4~6개월차에 반려견 상당수 데이터로 이상 탐지 모델을 학습하며, 7~8개월차에 동물병원 상당수에서 실사용 검증을 한다. 현재 시판 심박 센서 모듈로 시제품 상당수를 만들었고, 지인 반려견 상당수에게 2주간 착용해 심박 측정 오차가 수의 장비 대비 평균 상당한 비율임을 확인했다. 가장 큰 위험은 털 길이에 따른 측정 불안정이며, 4개월차에 털 길이별 착용 방식을 비교 시험한다.\n\n5. 팀 역량\n우수한 역량을 갖춘 인력으로 팀을 구성하였으며, 각자 맡은 역할을 성실하게 수행하여 사업을 성공적으로 이끌어 갈 계획이다."}], ITEMS=[{"code": "E1", "name": "문제 인식", "max": 15, "description": "해결하려는 문제가 구체적이고, 대상 고객과 현재의 불편이 근거와 함께 제시되는가"}, {"code": "E2", "name": "해결 방안", "max": 15, "description": "제안하는 해결책이 문제와 직접 연결되고, 핵심 기능과 차별점이 명확한가"}, {"code": "E3", "name": "시장성", "max": 15, "description": "목표 시장 규모와 성장성이 출처가 있는 수치로 제시되고, 진입 전략이 있는가"}, {"code": "E4", "name": "실현 가능성", "max": 15, "description": "개발 일정, 기술 구현 방법, 현재 준비 정도가 현실적인가"}, {"code": "E5", "name": "팀 역량", "max": 10, "description": "대표자와 팀의 경력이 사업과 연결되고 역할 분담이 명확한가"}], KEY='s-brain-human-rating-v1';
let store={}; try{store=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
let cur=0;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}};
const done=(id)=>store[id]&&ITEMS.every(it=>store[id][it.code]!==undefined&&store[id][it.code]!=='');
function render(){
  const d=DOCS[cur]; document.getElementById('dtitle').textContent=d.id+' · '+(cur+1)+' / '+DOCS.length;
  document.getElementById('doc').innerHTML=d.text.split('\n\n').map(p=>{const i=p.indexOf('\n');return '<b>'+p.slice(0,i).replace(/</g,'&lt;')+'</b>'+p.slice(i+1).replace(/</g,'&lt;')}).join('\n');
  document.getElementById('items').innerHTML=ITEMS.map(it=>'<div class="item"><div><b>'+it.name+'</b> <span class="note">(0~'+it.max+'점)</span><small>'+it.description+'</small></div><input type="number" min="0" max="'+it.max+'" step="0.5" data-c="'+it.code+'" value="'+((store[d.id]||{})[it.code]??'')+'" aria-label="'+it.name+' 점수"></div>').join('');
  document.querySelectorAll('#items input').forEach(inp=>inp.addEventListener('input',()=>{const v=inp.value===''?'':Math.max(0,Math.min(+inp.dataset.max||ITEMS.find(x=>x.code===inp.dataset.c).max,+inp.value));(store[d.id]=store[d.id]||{})[inp.dataset.c]=v;save();totals();nav();}));
  totals();nav();
}
function totals(){const d=DOCS[cur];document.getElementById('tot').textContent=ITEMS.reduce((a,it)=>a+(+((store[d.id]||{})[it.code])||0),0).toFixed(1);}
function nav(){
  const n=DOCS.filter(d=>done(d.id)).length;
  document.getElementById('prog').style.width=(100*n/DOCS.length)+'%';document.getElementById('count').textContent='채점 완료 '+n+' / '+DOCS.length;
  document.getElementById('nav').innerHTML=DOCS.map((d,i)=>'<span class="pill'+(done(d.id)?' done':'')+(i===cur?' cur':'')+'" data-i="'+i+'">'+d.id+'</span>').join('');
  document.querySelectorAll('.pill').forEach(p=>p.addEventListener('click',()=>{cur=+p.dataset.i;render();scrollTo(0,0)}));
}
document.getElementById('prev').onclick=()=>{cur=Math.max(0,cur-1);render();scrollTo(0,0)};
document.getElementById('next').onclick=()=>{cur=Math.min(DOCS.length-1,cur+1);render();scrollTo(0,0)};
document.getElementById('dl').onclick=()=>{
  const n=DOCS.filter(d=>done(d.id)).length;
  const out={rated_at:new Date().toISOString(),items:ITEMS.map(i=>i.code),ratings:store};
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,1)],{type:'application/json'}));a.download='ratings.json';a.click();
  document.getElementById('dlnote').textContent=n<DOCS.length?'(아직 '+(DOCS.length-n)+'편이 비어 있습니다 — 그대로 내려받았습니다)':'완료! 파일을 model-eval/human/ratings.json 으로 저장해 주세요.';
};
render();
</script></main></body></html>
