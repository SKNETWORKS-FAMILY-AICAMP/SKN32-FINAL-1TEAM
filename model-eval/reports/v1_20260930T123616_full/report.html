        <div class="kpi"><div class="k">순서 맞힘<small>망가진 계획서에 뚜렷하게 낮은 총점을 줌</small></div><div class="v">${ratio(m.order_hit, m.order_n)}</div></div>
        <div class="kpi"><div class="k">원인 짚기<small>망가뜨린 그 항목을 뚜렷하게 깎음</small></div><div class="v">${ratio(m.cause_hit, m.cause_n)}</div></div>
        <div class="kpi"><div class="k">깎은 폭<small>깎아야 할 항목을 만점의 몇 %나 내렸나(클수록 정확)</small></div><div class="v">${m.cause_depth == null ? '–' : Math.round(100 * m.cause_depth) + '<small> %</small>'}</div></div>
        <div class="kpi"><div class="k">흔들림<small>같은 입력 반복 시 총점 편차(작을수록 안정)</small></div><div class="v">${m.jitter == null ? '–' : fmt(m.jitter, 1) + '<small> 점</small>'}</div></div>
        <div class="kpi"><div class="k">원본 평균 점수<small>좋은 계획서가 높게 나오는지 (만점 ${D.total_max})</small></div><div class="v">${fmt(m.orig_mean, 1)}</div></div>
        <div class="kpi"><div class="k">형식 통과<small>항목 5개가 빠짐없이 나온 비율</small></div><div class="v">${okPct}<small> %</small></div></div>
        <div class="kpi"><div class="k">비용 · 시간<small>호출 ${m.calls}건 합계 · 호출당 평균</small></div><div class="v">$${(m.cost || 0).toFixed(3)}<small> · ${fmt(m.sec, 0)}초</small></div></div>
      </div>`;
    }).join('');
    return `<h2>한눈에 보기</h2><p class="sub">후보마다 카드 하나입니다. 숫자가 클수록 좋은 것은 위 두 개, 작을수록 좋은 것은 흔들림입니다.</p><div class="tiles">${cards}</div>`;
  }

  // ── 총점 점 그래프 ───────────────────────────────────────
  function dotChart() {
    const W = 1000, L = 190, R = 30, T = 30;
    const lanes = D.candidates.length, laneH = 13, pad = 16;
    const bandH = lanes * laneH + pad;
    const vars = VARS();
    const H = T + vars.length * bandH + 40;
    const x = (v) => L + (v / D.total_max) * (W - L - R);
    let g = '';
    for (let t = 0; t <= D.total_max; t += 10) {
      g += `<line x1="${x(t)}" x2="${x(t)}" y1="${T - 6}" y2="${H - 34}" stroke="var(--grid)" stroke-width="1"/>`;
      g += `<text class="axis-label" x="${x(t)}" y="${H - 18}" text-anchor="middle">${t}</text>`;
    }
    g += `<text class="axis-label" x="${(L + W - R) / 2}" y="${H}" text-anchor="middle">총점 (만점 ${D.total_max})</text>`;
    vars.forEach((v, vi) => {
      const y0 = T + vi * bandH;
      if (v.id === 'original') g += `<rect x="4" y="${y0 - 2}" width="${W - 8}" height="${bandH - 2}" rx="6" fill="var(--grid)" opacity=".35"/>`;
      g += `<text x="${L - 12}" y="${y0 + bandH / 2 - 2}" text-anchor="end" dominant-baseline="middle" style="fill:var(--ink)">${esc(v.short)}</text>`;
      D.candidates.forEach((c, ci) => {
        const cy = y0 + 6 + ci * laneH + laneH / 2;
        const vals = totalVals(c.id, v.plan, v.id);
        if (vals.length) {
          const mn = mean(vals);
          g += `<line x1="${x(Math.min(...vals))}" x2="${x(Math.max(...vals))}" y1="${cy}" y2="${cy}" stroke="${slot(ci)}" stroke-width="2" opacity=".45" stroke-linecap="round"/>`;
          g += `<rect x="${x(mn) - 1.5}" y="${cy - 6}" width="3" height="12" rx="1.5" fill="${slot(ci)}"/>`;
        }
        rowsOf(c.id, v.plan, v.id).forEach((r) => {
          g += `<circle cx="${x(r.total)}" cy="${cy}" r="4.5" fill="${slot(ci)}" stroke="var(--surface)" stroke-width="2"/>`;
          g += `<circle class="hit" data-c="${esc(c.id)}" data-v="${esc(v.short)}" data-t="${r.total.toFixed(1)}" data-r="${r.rep}" cx="${x(r.total)}" cy="${cy}" r="9" fill="transparent"/>`;
        });
      });
    });
    const legend = D.candidates.map((c, i) => `<span><span class="swatch" style="background:${slot(i)}"></span>${esc(c.id)}</span>`).join('');
    return `<h3 style="margin:20px 0 4px">총점 비교</h3>
      <p class="sub">한 줄이 계획서 한 종류입니다. 점 하나가 호출 한 번이고, 세로 막대는 평균입니다. <b>위에 있는 원본은 오른쪽(높은 점수)에, 나머지는 왼쪽으로 내려가야 정상</b>입니다. 점이 넓게 퍼질수록 같은 입력에도 점수가 흔들린다는 뜻입니다.</p>
      <div class="card"><div class="legend">${legend}</div><div class="scroll"><svg id="dots" viewBox="0 0 ${W} ${H}" style="min-width:720px;width:100%;height:auto" role="img" aria-label="변형별 총점 점 그래프">${g}</svg></div></div>`;
  }

  // ── 계획서 4편에서 일관됐나: 원본 대비 하락폭 ──────────────────
  function dropChart() {
    const base = D.variants.filter((v) => v.plan === plans[0] && v.id !== 'original');
    const W = 1000, L = 190, R = 30, T = 30, laneH = 13, pad = 16;
    const lanes = D.candidates.length, bandH = lanes * laneH + pad;
    const H = T + base.length * bandH + 40;
    const drops = (cid, vid) => plans.map((p) => {
      const o = mean(totalVals(cid, p, 'original')), t = mean(totalVals(cid, p, vid));
      return o == null || t == null ? null : o - t;
    }).filter((d) => d != null);
    let mx = 10;
    D.candidates.forEach((c) => base.forEach((v) => drops(c.id, v.id).forEach((d) => { mx = Math.max(mx, d); })));
    mx = Math.ceil(mx / 5) * 5;
    const x = (v) => L + (v / mx) * (W - L - R);
    let g = '';
    for (let t = 0; t <= mx; t += 5) {
      g += `<line x1="${x(t)}" x2="${x(t)}" y1="${T - 6}" y2="${H - 34}" stroke="var(--grid)"/>`;
      g += `<text class="axis-label" x="${x(t)}" y="${H - 18}" text-anchor="middle">${t}</text>`;
    }
    g += `<text class="axis-label" x="${(L + W - R) / 2}" y="${H}" text-anchor="middle">원본보다 총점이 내려간 폭 (점) — 오른쪽일수록 크게 깎음</text>`;
    base.forEach((v, vi) => {
      const y0 = T + vi * bandH;
      g += `<text x="${L - 12}" y="${y0 + bandH / 2 - 2}" text-anchor="end" dominant-baseline="middle" style="fill:var(--ink)">${esc(v.short)}</text>`;
      D.candidates.forEach((c, ci) => {
        const cy = y0 + 6 + ci * laneH + laneH / 2, ds = drops(c.id, v.id);
        if (!ds.length) return;
        g += `<line x1="${x(Math.min(...ds))}" x2="${x(Math.max(...ds))}" y1="${cy}" y2="${cy}" stroke="${slot(ci)}" stroke-width="2" opacity=".45" stroke-linecap="round"/>`;
        g += `<rect x="${x(mean(ds)) - 1.5}" y="${cy - 6}" width="3" height="12" rx="1.5" fill="${slot(ci)}"/>`;
        plans.forEach((p) => {
          const o = mean(totalVals(c.id, p, 'original')), t = mean(totalVals(c.id, p, v.id));
          if (o == null || t == null) return;
          g += `<circle cx="${x(o - t)}" cy="${cy}" r="4.5" fill="${slot(ci)}" stroke="var(--surface)" stroke-width="2"/>`;
          g += `<circle class="hit" data-c="${esc(c.id)}" data-v="${esc(v.short)}" data-t="${(o - t).toFixed(1)}" data-r="${esc(p)}" data-mode="drop" cx="${x(o - t)}" cy="${cy}" r="9" fill="transparent"/>`;
        });
      });
    });
    const legend = D.candidates.map((c, i) => `<span><span class="swatch" style="background:${slot(i)}"></span>${esc(c.id)}</span>`).join('');
    return `<h2>계획서 ${plans.length}편에서 일관되게 깎았나</h2>
      <p class="sub">점 하나는 계획서 한 편의 결과(반복 평균)이고, 세로 막대는 ${plans.length}편의 평균입니다. 점들이 <b>모여 있으면 계획서가 달라도 같은 판단</b>을 한다는 뜻이고, 흩어지면 계획서에 따라 들쭉날쭉하다는 뜻입니다. 오른쪽일수록 망가진 것을 크게 알아챈 것입니다.</p>
      <div class="card"><div class="legend">${legend}</div><div class="scroll"><svg viewBox="0 0 ${W} ${H}" style="min-width:720px;width:100%;height:auto" role="img" aria-label="계획서별 원본 대비 총점 하락폭">${g}</svg></div></div>`;
  }

  function planTabs() {
    if (plans.length < 2) return '';
    return `<div class="tabs" role="tablist">${D.plans.map((p) => `<button type="button" role="tab" class="tab${p.id === state.plan ? ' on' : ''}" data-plan="${esc(p.id)}" aria-selected="${p.id === state.plan}">${esc(p.title)}</button>`).join('')}</div>`;
  }

  function detailSection() {
    return `<h2>계획서별 자세히 보기</h2><p class="sub">계획서를 골라 총점과 항목별 점수를 봅니다.</p>${planTabs()}${dotChart()}${heatmaps()}`;
  }

  // ── 히트맵 ──────────────────────────────────────────────
  function heatmaps() {
    let out = `<h3 style="margin:24px 0 4px">어느 항목을 깎았나</h3>
      <p class="sub">칸 하나가 (계획서 종류 × 평가항목)의 평균 점수입니다. 색이 진할수록 고득점입니다. <b>▼ 표시 칸은 이 변형에서 원본보다 깎여야 하는 곳</b>이고, 실제로 <b>뚜렷하게(그 항목 만점의 10% 이상)</b> 깎였으면 ✓, 아니면 ✗입니다. 칸을 누르면 모델이 준 이유를 볼 수 있습니다.</p>`;
    D.candidates.forEach((c, ci) => {
      const m = D.metrics[c.id] || {};
      const head = `<tr><th></th>${D.items.map((it) => `<th>${esc(it.name)}<small>${it.code} · ${it.max}점</small></th>`).join('')}<th>총점<small>${D.total_max}점</small></th></tr>`;
      const body = VARS().map((v) => {
        const isOrig = v.id === 'original';
        const cells = D.items.map((it) => cell(c.id, v, it.code, it.max, isOrig)).join('');
        const tv = totalVals(c.id, v.plan, v.id), to = totalVals(c.id, v.plan, 'original');
        const tc = totalCell(c.id, v, isOrig, tv, to);
        return `<tr><td class="rowlabel">${esc(v.short)}<small>${esc(v.note)} · ${isOrig ? '기준' : '깎여야 할 항목: ' + (v.expect.length ? v.expect.join(', ') : '총점만 확인')}</small></td>${cells}<td class="total cellwrap">${tc}</td></tr>`;
      }).join('');
      out += `<div class="card" style="margin-top:12px" data-cand="${esc(c.id)}">
        <div class="cand-head"><span class="swatch" style="background:${slot(ci)}"></span><h3>${esc(c.id)}</h3>
          <span class="mode">${esc(c.model)} · ${esc(c.mode)}</span>
          <span class="mode">· 원인 짚기 ${m.cause_n ? m.cause_hit + '/' + m.cause_n : '–'}</span></div>
        <div class="scroll"><table class="heat"><thead>${head}</thead><tbody>${body}</tbody></table></div>
        <div class="detail muted" data-detail>칸을 누르면 여기에 모델이 준 점수와 이유가 나옵니다.</div></div>`;
    });
    out += `<div class="heatlegend"><span>낮은 점수</span><span class="ramp"></span><span>높은 점수</span>
      <span>· ▼ 깎여야 할 칸 (윤곽선)</span><span>· ✓ 뚜렷하게 깎임(만점의 10% 이상)</span><span>· ✗ 안 깎이거나 조금만 깎임</span></div>`;
    return out;
  }

  const tcls = (f) => (f > .6 ? ' t60' : '') + (f > .8 ? ' t80' : '');
  function cell(cid, v, code, max, isOrig) {
    const vals = itemVals(cid, v.plan, v.id, code);
    if (!vals.length) return `<td class="cellwrap"><button class="cell empty" type="button" disabled>–</button></td>`;
    const mn = mean(vals);
    const base = mean(itemVals(cid, v.plan, 'original', code));
    const f = Math.max(0, Math.min(1, mn / max));
    const exp = v.expect.includes(code);
    let res = '', d = '';
    if (!isOrig && base != null) {
      const diff = mn - base;
      d = `<span class="d">${diff >= 0 ? '+' : '−'}${Math.abs(diff).toFixed(1)} vs 원본</span>`;
      if (exp) res = diff < -D.margin_item * max ? `<span class="res" style="color:inherit" aria-label="깎임">✓</span>` : `<span class="res" aria-label="안 깎임">✗</span>`;
    }
    const mark = exp ? `<span class="mark" aria-hidden="true">▼</span>` : '';
    return `<td class="cellwrap"><button class="cell${tcls(f)}${exp ? ' expect' : ''}" type="button" style="--f:${f.toFixed(3)}"
      data-c="${esc(cid)}" data-p="${esc(v.plan)}" data-v="${esc(v.id)}" data-i="${code}" data-max="${max}">
      ${mark}${res}<span class="n">${fmt(mn, 1)}</span>${d}</button></td>`;
  }

  function totalCell(cid, v, isOrig, tv, to) {
    if (!tv.length) return `<button class="cell empty" type="button" disabled>–</button>`;
    const mn = mean(tv), f = Math.max(0, Math.min(1, mn / D.total_max));
    const d = (!isOrig && to.length) ? `<span class="d">${mean(tv) - mean(to) >= 0 ? '+' : '−'}${Math.abs(mean(tv) - mean(to)).toFixed(1)} vs 원본</span>` : '';
    return `<button class="cell${tcls(f)}" type="button" style="--f:${f.toFixed(3)}" data-c="${esc(cid)}" data-p="${esc(v.plan)}" data-v="${esc(v.id)}" data-i="__total" data-max="${D.total_max}">
      <span class="n">${fmt(mn, 1)}</span>${d}</button>`;
  }

  // ── 상세(칸 클릭) ────────────────────────────────────────
  function showDetail(btn) {
    const card = btn.closest('.card');
    card.querySelectorAll('button.cell.sel').forEach((b) => b.classList.remove('sel'));
    btn.classList.add('sel');
    const { c, p, v, i } = btn.dataset;
    const variant = D.variants.find((x) => x.plan === p && x.id === v);
    const reps = rowsOf(c, p, v);
    const name = i === '__total' ? '총점' : (D.items.find((x) => x.code === i) || {}).name;
    const body = reps.map((r) => {
      if (i === '__total') {
        const parts = D.items.map((it) => `${it.name} ${r.scores[it.code].score.toFixed(1)}`).join(' · ');
        return `<div class="rep"><div class="sc">${r.rep}회차<br><span class="muted" style="font-weight:400">${r.total.toFixed(1)}점</span></div><div class="ev">${esc(parts)}</div></div>`;
      }
      const s = r.scores[i];
      const q = s.evidence && s.evidence !== '없음' ? `<div class="ev">인용: <q>${esc(s.evidence)}</q></div>` : `<div class="ev">인용 없음</div>`;
      return `<div class="rep"><div class="sc">${r.rep}회차<br><span class="muted" style="font-weight:400">${s.score.toFixed(1)}점</span></div><div>${esc(s.comment)}${q}</div></div>`;
    }).join('');
    card.querySelector('[data-detail]').className = 'detail';
    card.querySelector('[data-detail]').innerHTML = `<b>${esc(variant.note)} · ${esc(name)}</b><div class="muted" style="font-size:13px">반복 ${reps.length}회</div>${body}`;
  }

  // ── 표 보기 + 실패 ───────────────────────────────────────
  function tableView() {
    const rows = D.candidates.map((c) => {
      const m = D.metrics[c.id] || {};
      return `<tr><td>${esc(c.id)}</td><td>${m.calls}</td><td>${m.ok}</td><td>${m.parsed}</td><td>${fmt(m.orig_mean)}</td>
        <td>${m.order_n ? m.order_hit + '/' + m.order_n : '–'}</td><td>${m.cause_n ? m.cause_hit + '/' + m.cause_n : '–'}</td><td>${m.cause_depth == null ? '–' : Math.round(100 * m.cause_depth) + '%'}</td>
        <td>${fmt(m.jitter, 2)}</td><td>${fmt(m.sec, 1)}</td><td>${fmt(m.reasoning, 0)}</td><td>${(m.cost || 0).toFixed(3)}</td></tr>`;
    }).join('');
    const failed = D.rows.filter((r) => !r.ok || !r.valid);
    const fl = failed.length ? `<h3 style="margin-top:16px">실패 또는 형식 불량 ${failed.length}건</h3><ul class="note">${failed.map((r) =>
      `<li class="fail">${esc(r.cand)} / ${esc(r.variant)} / ${r.rep}회차: ${esc(r.error || '항목 누락·중복(형식 불량)')}</li>`).join('')}</ul>` : '';
    return `<details class="tbl"><summary>표로 보기 (같은 숫자, 접근성용)</summary><div class="scroll" style="margin-top:8px"><table class="data">
      <thead><tr><th>후보</th><th>호출</th><th>성공</th><th>형식 통과</th><th>원본 평균</th><th>순서 맞힘</th><th>원인 짚기</th><th>깎은 폭</th><th>흔들림 σ</th><th>평균 시간(초)</th><th>추론 토큰</th><th>비용($)</th></tr></thead>
      <tbody>${rows}</tbody></table></div>${fl}</details>`;
  }

  function limits() {
    return `<h2>이 결과를 읽을 때</h2><div class="card note">
      <p style="margin-top:0">· 계획서는 <b>가상 샘플(AI 초안) 한 편</b>이고, 이 실험은 노골적으로 나쁜 글을 걸러내는지만 봅니다. 미묘한 품질 차이는 사람이 매긴 점수로 따로 확인해야 합니다.</p>
      <p>· 모델이 낸 총점은 쓰지 않고 항목 점수를 코드가 합산했습니다.</p>
      <p style="margin-bottom:0">· 반복 횟수가 적으면 “흔들림”은 참고용입니다.</p></div>`;
  }

  // ── 그리기 ──────────────────────────────────────────────
  if (!D.rows.length) {
    app.innerHTML = header() + '<div class="empty-state">아직 결과가 없습니다.</div>';
  } else {
    app.innerHTML = header() + tiles() + (plans.length > 1 ? dropChart() : '') + '<div id="detail">' + detailSection() + '</div>' + tableView() + limits();
  }

  app.addEventListener('click', (e) => {
    const t = e.target.closest('button.tab');
    if (t) { state.plan = t.dataset.plan; document.getElementById('detail').innerHTML = detailSection(); return; } const b = e.target.closest('button.cell'); if (b && !b.disabled) showDetail(b); });
  app.addEventListener('mousemove', (e) => {
    const h = e.target.closest('circle.hit');
    if (h && h.dataset.mode === 'drop') {
      const pl = D.plans.find((p) => p.id === h.dataset.r);
      return showTip(e, `<b>${esc(h.dataset.c)}</b>${esc(h.dataset.v)}<br>${esc(pl ? pl.title : h.dataset.r)}<br>원본보다 ${h.dataset.t}점 하락`);
    }
    if (h) return showTip(e, `<b>${esc(h.dataset.c)}</b>${esc(h.dataset.v)}<br>${h.dataset.r}회차 · 총점 ${h.dataset.t}`);
    const b = e.target.closest('button.cell');
    if (b && !b.disabled) {
      const v = D.variants.find((x) => x.plan === b.dataset.p && x.id === b.dataset.v);
      const nm = b.dataset.i === '__total' ? '총점' : (D.items.find((x) => x.code === b.dataset.i) || {}).name;
      const vals = b.dataset.i === '__total' ? totalVals(b.dataset.c, b.dataset.p, b.dataset.v) : itemVals(b.dataset.c, b.dataset.p, b.dataset.v, b.dataset.i);
      return showTip(e, `<b>${esc(v.note)}</b>${esc(nm)}: ${vals.map((x) => x.toFixed(1)).join(', ')} (만점 ${b.dataset.max})`);
    }
    hideTip();
  });
  app.addEventListener('mouseleave', hideTip);
  const themeBtn = document.getElementById('themeBtn');
  if (themeBtn) themeBtn.addEventListener('click', () => {
    const root = document.documentElement;
    const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme = dark ? 'light' : 'dark';
  });
})();
</script>
</body>
</html>
