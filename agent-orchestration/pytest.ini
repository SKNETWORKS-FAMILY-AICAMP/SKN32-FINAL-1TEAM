[pytest]
testpaths = tests
# 기본은 동시 실행(pytest-xdist, CPU 수만큼 프로세스). 묶음(xdist_group)이 같은 테스트는 한 프로세스에서 하나씩 돈다:
#   mysql  — MySQL에 닿는 테스트 전부 (tests/mysqldb.py MYSQL)
#   timing — 시간에 기대는 테스트 (tests/conftest.py TIMING)
# 하나씩 실행: python -m pytest -n 0   (-p no:xdist는 아래 -n 인자 때문에 인자 오류)
addopts = -q -n auto --dist loadgroup
