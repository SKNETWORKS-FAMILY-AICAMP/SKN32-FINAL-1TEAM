# sbrain 패키지 — 웹 서버 프로세스가 설치해 명령 · 조회 함수(build_web)를 불러 쓴다.
#   pip install -e <이 폴더>        # 개발 중 (코드 변경이 바로 반영)
#   pip install <이 폴더>           # 배포
# 의존성은 requirements.txt와 같다(테스트가 확인한다). 워커는 sbrain-worker 또는 python -m sbrain.worker.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sbrain"
version = "0.1.0"
description = "S-Brain Agent Orchestration — Orchestrator 뼈대 · 조율 Agent · 워커"
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.13.5",
    "SQLAlchemy==2.1.1",
    "PyMySQL==1.2.3",
    "openai==3.20.0",
    "python-dotenv==1.2.3",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "pytest-xdist==3.8.0", "pytest-cov==7.1.0"]

[project.scripts]
sbrain-worker = "sbrain.worker:main"

[tool.setuptools.packages.find]
include = ["sbrain*"]

# 전략 · 작성 · 검증-1 담당자 자료(JSON · MD)를 설치본에 넣는다 — 담당자 코드가 불러올 때 읽는 코드의 일부다
# (spec 4.1 · sbrain/agents/partner_sw/VENDORED.md). 새 의존성은 없다.
[tool.setuptools.package-data]
"sbrain.agents.partner_sw.agent_strategy" = ["res/**/*.json", "res/**/*.md"]
"sbrain.agents.partner_sw.agent_strategy.runtime" = ["*.json"]
"sbrain.agents.partner_sw.agent_validation_1" = ["res/**/*.json", "res/**/*.md"]

# 줄 단위 확인 범위 측정 (pytest-cov) — 측정할 때만 쓴다: python -m pytest -n 0 --cov=sbrain --cov-report=json:<파일>
# 파일 경로는 이 폴더 기준 상대 경로, 워커 스레드 안에서 실행된 줄도 센다.
[tool.coverage.run]
source = ["sbrain"]
relative_files = true
concurrency = ["thread"]
