<meta charset="utf-8">

<title>S-Brain 데이터 흐름</title>
<style>
  :root {
    --bg:#faf8f5; --ink:#2b2724; --muted:#7a716a; --line:#e0d6ca;
    --red:#a4362f; --blue:#2f6ea4; --gray:#8a7f74;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.6 'Malgun Gothic','Segoe UI',sans-serif; }
  .page { max-width:1280px; margin:0 auto; padding:22px 18px 60px; }
  h1 { font-size:23px; margin:0 0 4px; letter-spacing:-.3px; }
  .sub { color:var(--muted); margin:0 0 14px; font-size:13px; }

  .bar { display:flex; flex-wrap:wrap; gap:14px; align-items:center;
         background:#fff; border:1px solid var(--line); border-radius:10px;
         padding:11px 14px; margin-bottom:14px; position:sticky; top:0; z-index:5; }
  .key { display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted); }
  .key i { width:26px; height:0; border-top:2.5px solid var(--gray); display:inline-block; }
  .key.red i { border-color:var(--red); }
  .key.blue i { border-color:var(--blue); }
  .hint { margin-left:auto; font-size:12.5px; color:var(--muted); }
  .hint b { color:var(--red); }
  #panel { font-size:12.5px; color:var(--ink); min-height:19px; }
  #panel b { color:var(--red); }

  .canvas { background:#fff; border:1px solid var(--line); border-radius:12px;
            padding:6px; overflow-x:auto; }
  svg { display:block; width:100%; height:auto; min-width:1050px; }

  /* ── 기본 상태 ───────────────────────────── */
  .edge { fill:none; stroke-width:1.7; opacity:.9; transition:opacity .16s, stroke-width .16s; }
  .edge.g { stroke:var(--gray); marker-end:url(#mkG); }
  .edge.r { stroke:var(--red);  marker-end:url(#mkR); }
  .edge.b { stroke:var(--blue); marker-end:url(#mkB); }
  .node { cursor:pointer; transition:opacity .16s; }
  .node rect { transition:stroke .16s, stroke-width .16s; }
  .elabel { transition:opacity .16s; }

  /* ── 무언가를 지목한 상태 ─────────────────── */
  body.focus .edge { opacity:.07; }
  body.focus .elabel { opacity:.12; }
  body.focus .node { opacity:.3; }

  body.focus .edge.on { opacity:1; stroke-width:3.2;
    stroke-dasharray:9 7; animation:flow .7s linear infinite; }
  body.focus .edge.on.g { marker-end:url(#mkGh); }
  body.focus .edge.on.r { marker-end:url(#mkRh); }
  body.focus .edge.on.b { marker-end:url(#mkBh); }
  body.focus .elabel.on { opacity:1; }
  body.focus .node.on { opacity:1; }
  body.focus .node.src rect { stroke:var(--red); stroke-width:2.4; }
  body.focus .node.on rect { stroke-width:2; }

  @keyframes flow { to { stroke-dashoffset:-16; } }

  text { font-family:'Malgun Gothic','Segoe UI',sans-serif; }
  .t   { font-size:13px; fill:#2b2724; }
  .tb  { font-size:13px; fill:#2b2724; font-weight:700; }
  .s   { font-size:11.5px; fill:#7a716a; }
  .n   { font-size:11px; fill:#a4362f; font-weight:700; }
  .h   { font-size:15px; fill:#2b2724; font-weight:700; }
  .hs  { font-size:11.5px; fill:#7a716a; }
  .lblG{ font-size:11px; fill:#8a7f74; }
  .lblR{ font-size:11px; fill:#a4362f; font-weight:700; }
  .lblB{ font-size:11px; fill:#2f6ea4; font-weight:700; }
  .bx  { fill:#fff; stroke:#e0d6ca; stroke-width:1.2; }
  .bxa { fill:#fdf0ee; stroke:#e3bdb8; stroke-width:1.2; }
  .bxb { fill:#eef4fa; stroke:#b9cfe3; stroke-width:1.2; }
  .bxg { fill:#f7f3ee; stroke:#e0d6ca; stroke-width:1.2; }
  .zone{ fill:none; stroke:#cfc3b5; stroke-width:1.3; stroke-dasharray:7 5; }
</style>

<script>
const svg = document.getElementById('svg');
const panel = document.getElementById('panel');
const nodes = [...svg.querySelectorAll('.node')];
const edges = [...svg.querySelectorAll('.edge')];
const labels = [...svg.querySelectorAll('.elabel')];
let pinned = null;

function nodeById(id) { return nodes.find(n => n.dataset.id === id); }

function focus(id) {
  document.body.classList.add('focus');
  const touched = new Set([id]);

  for (const e of edges) {
    const hit = e.dataset.a === id || e.dataset.b === id;
    e.classList.toggle('on', hit);
    if (hit) { touched.add(e.dataset.a); touched.add(e.dataset.b); }
  }
  for (const l of labels) {
    l.classList.toggle('on', l.dataset.a === id || l.dataset.b === id);
  }
  for (const n of nodes) {
    n.classList.toggle('on', touched.has(n.dataset.id));
    n.classList.toggle('src', n.dataset.id === id);
  }

  const me = nodeById(id);
  const linked = [...touched].filter(x => x !== id).length;
  panel.innerHTML = `<b>${me.querySelector('.t, .tb').textContent.trim()}</b> — `
    + (me.dataset.desc || '') + `  <span style="color:#7a716a">· 연결 ${linked}개</span>`;
}

function clear() {
  document.body.classList.remove('focus');
  edges.forEach(e => e.classList.remove('on'));
  labels.forEach(l => l.classList.remove('on'));
  nodes.forEach(n => n.classList.remove('on', 'src'));
  panel.textContent = '';
}

for (const n of nodes) {
  n.addEventListener('mouseenter', () => { if (!pinned) focus(n.dataset.id); });
  n.addEventListener('mouseleave', () => { if (!pinned) clear(); });
  n.addEventListener('click', (ev) => {
    ev.stopPropagation();
    if (pinned === n.dataset.id) { pinned = null; clear(); }
    else { pinned = n.dataset.id; focus(pinned); }
  });
}
document.addEventListener('click', () => { if (pinned) { pinned = null; clear(); } });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && pinned) { pinned = null; clear(); }
});
</script>
