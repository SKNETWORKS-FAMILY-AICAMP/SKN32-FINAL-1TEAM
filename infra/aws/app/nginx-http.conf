# HTTP 만 — 도메인이 없거나 HTTPS 인증서를 아직 받지 못했을 때.
# install-app.sh 가 __SERVER_NAME__ 을 도메인(없으면 _)으로 바꿔 /etc/nginx/sites-available/sbrain 으로 둔다. 서버에서 직접 고치지 않는다.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __SERVER_NAME__;
    server_tokens off;

    # Let's Encrypt 인증서 받기 · 갱신 확인용(certbot --webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include /etc/nginx/snippets/sbrain-app.conf;
}
