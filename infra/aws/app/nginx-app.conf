# S-Brain 앱 공통 위치 — install-app.sh 가 /etc/nginx/snippets/sbrain-app.conf 로 두고 nginx-http.conf · nginx-https.conf 가 불러 쓴다.
# 서버에서 직접 고치지 않는다(다시 올리면 덮어쓴다).

# 프론트(React, Vite 빌드 결과). 화면은 주소 하나(/)에서 바뀐다
root /var/www/sbrain;
index index.html;

# 첨부 파일 5개 × 10MB(웹 ATTACH_MAX_FILES · ATTACH_MAX_MB 기본값) + 여유
client_max_body_size 60m;

# 백엔드 — 프론트는 VITE_API_BASE=/api 로 빌드한다. /api/ 를 떼고 FastAPI 로 넘긴다(같은 주소라 CORS 가 필요 없다)
location /api/ {
    proxy_pass http://127.0.0.1:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 계획서 PDF 만들기는 최대 120초 — 여유를 둔다
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
}

# 빌드 결과의 파일 이름에 내용 값이 붙어 있어 오래 캐시해도 된다
location /assets/ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
}

# index.html 은 새로 올리면 바로 보이게 캐시하지 않는다
location = /index.html {
    add_header Cache-Control "no-cache";
}

location / {
    try_files $uri $uri/ /index.html;
}
