# HTTPS — 도메인의 Let's Encrypt 인증서가 있을 때. HTTP 는 HTTPS 로 넘긴다(인증서 갱신 확인만 HTTP 로 받는다).
# install-app.sh 가 __DOMAIN__ 을 도메인으로 바꿔 /etc/nginx/sites-available/sbrain 으로 둔다. 서버에서 직접 고치지 않는다.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __DOMAIN__;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Ubuntu 24.04 의 nginx 1.24 문법(http2 는 listen 에 붙인다)
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name __DOMAIN__;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:sbrain_ssl:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;

    include /etc/nginx/snippets/sbrain-app.conf;
}
