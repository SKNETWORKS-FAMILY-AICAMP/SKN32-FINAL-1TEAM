AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  S-Brain one-click stack. VPC with one public and two private subnets, web EC2
  with an Elastic IP, notice-server EC2 in a private subnet behind a NAT gateway,
  RDS MySQL, and an S3 bucket for bootstrap files. Created and deleted by
  infra/aws/up.sh and infra/aws/down.sh.

# Keep this file ASCII-only. The AWS CLI on a Korean Windows PC may read the
# template with the cp949 codec. Korean notes live in infra/aws/README.md.
#
# Nothing here is tied to one AWS account: the AMI, the availability zones and
# the admin IP are passed in by up.sh, and every name is derived from the stack
# name or generated by AWS.

Parameters:
  PrimaryAz:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: AZ for the public subnet, both EC2 instances and the DB. up.sh picks one that offers every instance type.
  SecondaryAz:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: Second AZ. Only used because an RDS subnet group needs two AZs.
  AmiId:
    Type: AWS::EC2::Image::Id
    Description: Ubuntu 24.04 amd64 AMI. up.sh looks it up once at creation so later updates never replace the servers.
  AdminCidr:
    Type: String
    Description: CIDR allowed to SSH into the web EC2. up.sh uses the current public IP of your PC (/32).
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
  WebInstanceType:
    Type: String
    Default: c7i-flex.large
  NoticeInstanceType:
    Type: String
    Default: m7i-flex.large
    Description: The notice server loads BGE-M3 (peak about 2.7 GB), so keep at least 4 GB of memory.
  NoticePrivateIp:
    Type: String
    Default: 10.20.11.10
    Description: Fixed private IP of the notice server, so the web server can always call http://<this ip>:8000.
    AllowedPattern: '^10\.20\.11\.([4-9]|[1-9][0-9]|1[0-9][0-9]|2[0-4][0-9]|25[0-4])$'
  DbInstanceClass:
    Type: String
    Default: db.t4g.micro
  DbEngineVersion:
    Type: String
    Default: '8.4'
    AllowedValues: ['8.4', '8.0']
    Description: MySQL major version. RDS picks the default minor version.
  DbAllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
  DbMasterUsername:
    Type: String
    Default: sbrain_admin
    AllowedPattern: '^[a-zA-Z][a-zA-Z0-9_]{0,15}$'

Resources:
  # ---------------------------------------------------------------- network
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-vpc'

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-igw'

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Ref PrimaryAz
      CidrBlock: 10.20.1.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-public'

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Ref PrimaryAz
      CidrBlock: 10.20.11.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-private-a'

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Ref SecondaryAz
      CidrBlock: 10.20.12.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-private-b'

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-public'

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  NatEip:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-nat'

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnet
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-nat'

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-private'

  # Private subnets reach the internet (K-Startup, OpenAI, Hugging Face, apt)
  # only through the NAT gateway. Traffic inside the VPC never uses it.
  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnetARouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetBRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

  # Free gateway endpoint: S3 traffic skips the NAT gateway and its data charge.
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      VpcEndpointType: Gateway
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      RouteTableIds:
        - !Ref PublicRouteTable
        - !Ref PrivateRouteTable

  # --------------------------------------------------------- security groups
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: S-Brain web - HTTP and HTTPS from anywhere, SSH from the admin IP
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AdminCidr
          Description: SSH from admin
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-web'

  NoticeSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: S-Brain notice server - API and SSH only from the web server
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !Ref WebSecurityGroup
          Description: Notice API from web
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          SourceSecurityGroupId: !Ref WebSecurityGroup
          Description: SSH jump from web
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-notice'

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: S-Brain MySQL - only from the two servers
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref WebSecurityGroup
          Description: MySQL from web
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref NoticeSecurityGroup
          Description: MySQL from notice server
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-db'

  # ---------------------------------------------------------------- storage
  # bootstrap/ holds the DB setup bundle uploaded by up.sh; deploy/ holds the app
  # release bundles uploaded by deploy-app.sh; app/ is for the apps.
  DeployBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  # ---------------------------------------------------------------- secrets
  # Password for the application DB user. Letters and digits only, because the
  # web backend puts it into a SQLAlchemy URL without escaping.
  AppDbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: S-Brain application MySQL user (created by setup-db.sh)
      GenerateSecretString:
        SecretStringTemplate: '{"username": "sbrain_app"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true

  # --------------------------------------------------------------------- db
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: S-Brain private subnets
      SubnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB

  # The web backend passes no TLS options; PyMySQL 1.2+ still encrypts on its
  # own, but older clients would not, so TLS is not forced. The DB is only
  # reachable from the two servers inside the VPC.
  DbParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Description: S-Brain MySQL parameters
      Family: !Sub 'mysql${DbEngineVersion}'
      Parameters:
        require_secure_transport: '0'

  DbInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: mysql
      EngineVersion: !Ref DbEngineVersion
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: !Ref DbAllocatedStorage
      StorageType: gp3
      StorageEncrypted: true
      MasterUsername: !Ref DbMasterUsername
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref DbSubnetGroup
      DBParameterGroupName: !Ref DbParameterGroup
      VPCSecurityGroups:
        - !Ref DbSecurityGroup
      AvailabilityZone: !Ref PrimaryAz
      MultiAZ: false
      PubliclyAccessible: false
      BackupRetentionPeriod: 1
      CopyTagsToSnapshot: true
      DeletionProtection: false
      AutoMinorVersionUpgrade: true

  # -------------------------------------------------------------------- iam
  InstanceBasePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: S-Brain servers - read bootstrap files, use app/ in the bucket, read the app DB secret
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: s3:ListBucket
            Resource: !GetAtt DeployBucket.Arn
          - Effect: Allow
            Action: s3:GetObject
            Resource: !Sub '${DeployBucket.Arn}/bootstrap/*'
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
            Resource: !Sub '${DeployBucket.Arn}/app/*'
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: !Ref AppDbSecret

  WebRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore'
        - !Ref InstanceBasePolicy

  NoticeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore'
        - !Ref InstanceBasePolicy

  # Only the notice server runs the DB setup, so only it may read the master
  # password. A separate resource keeps the servers from waiting for RDS.
  NoticeMasterSecretPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: read-db-master-secret
      Roles:
        - !Ref NoticeRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: !GetAtt DbInstance.MasterUserSecret.SecretArn

  # Only the web server runs the apps (web backend and worker), so only it may
  # read the app settings that infra/aws/app-env.sh stores in SSM Parameter
  # Store (/<stack>/app/*, SecureString with the default aws/ssm key) and the
  # release bundles that infra/aws/deploy-app.sh uploads to deploy/.
  WebAppPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: read-app-settings-and-releases
      Roles:
        - !Ref WebRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: ssm:GetParametersByPath
            Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/app'
          - Effect: Allow
            Action:
              - ssm:GetParameter
              - ssm:GetParameters
            Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/app/*'
          - Effect: Allow
            Action: s3:GetObject
            Resource: !Sub '${DeployBucket.Arn}/deploy/*'

  # The notice server runs the notice API and the daily collection batch, so it
  # may read the notice settings that infra/aws/deploy-notice.sh stores in SSM
  # Parameter Store (/<stack>/notice/*, SecureString with the default aws/ssm
  # key) and the bundles it uploads to deploy/notice/. Nothing else in deploy/.
  NoticeAppPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: read-notice-settings-and-releases
      Roles:
        - !Ref NoticeRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: ssm:GetParametersByPath
            Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/notice'
          - Effect: Allow
            Action:
              - ssm:GetParameter
              - ssm:GetParameters
            Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/notice/*'
          - Effect: Allow
            Action: s3:GetObject
            Resource: !Sub '${DeployBucket.Arn}/deploy/notice/*'

  WebInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref WebRole

  NoticeInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref NoticeRole

  # -------------------------------------------------------------- instances
  # AWS keeps the private key in SSM Parameter Store at /ec2/keypair/<id>.
  # up.sh saves it to ~/.ssh/<stack>-<region>.pem.
  KeyPair:
    Type: AWS::EC2::KeyPair
    Properties:
      KeyName: !Sub '${AWS::StackName}-key'
      KeyType: ed25519

  InstanceLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
          HttpPutResponseHopLimit: 2

  WebInstance:
    Type: AWS::EC2::Instance
    DependsOn:
      - PublicDefaultRoute
      - PublicSubnetRouteAssociation
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref WebInstanceType
      KeyName: !Ref KeyPair
      IamInstanceProfile: !Ref WebInstanceProfile
      LaunchTemplate:
        LaunchTemplateId: !Ref InstanceLaunchTemplate
        Version: !GetAtt InstanceLaunchTemplate.LatestVersionNumber
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref WebSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-web'
        - Key: Role
          Value: web
      UserData:
        Fn::Base64: |
          #!/bin/bash
          # Runs once at first boot. setup-db.sh waits for the marker file at the end.
          set -uo pipefail
          exec >>/var/log/sbrain-userdata.log 2>&1
          echo "start $(date -u +%FT%TZ) role=web"
          # The Elastic IP is attached a few seconds after boot. Wait for the internet.
          for i in $(seq 1 60); do
            curl -fsS --max-time 5 -o /dev/null https://checkip.amazonaws.com && break
            sleep 5
          done
          export DEBIAN_FRONTEND=noninteractive
          apt-get -y -o DPkg::Lock::Timeout=600 update
          apt-get -y -o DPkg::Lock::Timeout=600 install mysql-client python3-venv python3-pip unzip nginx
          snap wait system seed.loaded
          snap install aws-cli --classic
          if [ ! -f /swapfile ]; then
            fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile \
              && echo '/swapfile none swap sw 0 0' >> /etc/fstab
          fi
          mkdir -p /etc/sbrain /opt/sbrain
          echo "done $(date -u +%FT%TZ)"
          touch /var/lib/sbrain-userdata.done

  # Attaching the Elastic IP here is the "fixed IP" step.
  WebEip:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      InstanceId: !Ref WebInstance
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-web'

  NoticeInstance:
    Type: AWS::EC2::Instance
    DependsOn:
      - PrivateDefaultRoute
      - PrivateSubnetARouteAssociation
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref NoticeInstanceType
      KeyName: !Ref KeyPair
      IamInstanceProfile: !Ref NoticeInstanceProfile
      LaunchTemplate:
        LaunchTemplateId: !Ref InstanceLaunchTemplate
        Version: !GetAtt InstanceLaunchTemplate.LatestVersionNumber
      SubnetId: !Ref PrivateSubnetA
      PrivateIpAddress: !Ref NoticePrivateIp
      SecurityGroupIds:
        - !Ref NoticeSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 30
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-notice'
        - Key: Role
          Value: notice
      UserData:
        Fn::Base64: |
          #!/bin/bash
          # Runs once at first boot. setup-db.sh waits for the marker file at the end.
          set -uo pipefail
          exec >>/var/log/sbrain-userdata.log 2>&1
          echo "start $(date -u +%FT%TZ) role=notice"
          # The NAT gateway route may need a moment. Wait for the internet.
          for i in $(seq 1 60); do
            curl -fsS --max-time 5 -o /dev/null https://checkip.amazonaws.com && break
            sleep 5
          done
          export DEBIAN_FRONTEND=noninteractive
          apt-get -y -o DPkg::Lock::Timeout=600 update
          apt-get -y -o DPkg::Lock::Timeout=600 install mysql-client python3-venv python3-pip unzip
          snap wait system seed.loaded
          snap install aws-cli --classic
          # Swap keeps BGE-M3 load peaks from killing processes.
          if [ ! -f /swapfile ]; then
            fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile \
              && echo '/swapfile none swap sw 0 0' >> /etc/fstab
          fi
          mkdir -p /etc/sbrain /opt/sbrain
          echo "done $(date -u +%FT%TZ)"
          touch /var/lib/sbrain-userdata.done

Outputs:
  WebPublicIp:
    Description: Fixed public IP of the web server
    Value: !Ref WebEip
  WebInstanceId:
    Value: !Ref WebInstance
  NoticeInstanceId:
    Value: !Ref NoticeInstance
  NoticePrivateIp:
    Description: Fixed private IP of the notice server (port 8000, reachable only from the web server)
    Value: !GetAtt NoticeInstance.PrivateIp
  DbEndpoint:
    Value: !GetAtt DbInstance.Endpoint.Address
  DbPort:
    Value: !GetAtt DbInstance.Endpoint.Port
  DbMasterSecretArn:
    Value: !GetAtt DbInstance.MasterUserSecret.SecretArn
  AppDbSecretArn:
    Value: !Ref AppDbSecret
  DeployBucketName:
    Value: !Ref DeployBucket
  KeyPairId:
    Value: !GetAtt KeyPair.KeyPairId
  KeyName:
    Value: !Ref KeyPair
  VpcId:
    Value: !Ref Vpc
