# S-Brain 웹 배포 — 백엔드(FastAPI) + 화면/HTTPS(Caddy)
#
#   cd deploy
#   cp .env.example .env      # 값 채우기
#   docker compose up -d --build
#
# 빌드 위치는 저장소 루트(..)다. 각 Dockerfile 옆의 *.dockerignore 가 필요한 폴더만 넘긴다.
name: sbrain

services:
  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    env_file: .env
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}   # 비어 있으면 :80 (HTTP만)
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data        # 받은 HTTPS 인증서. 지우면 다시 발급받는다
      - caddy_config:/config
    depends_on:
      - backend
    restart: unless-stopped

  # 매일 수집 배치. profiles 때문에 `docker compose up` 으로는 켜지지 않는다.
  # 예약 실행은 run_batch.sh 가 `docker compose --profile batch run --rm batch …` 로 부른다.
  # 코드·data/·.env 는 서버의 ~/sbrain/data-collection 을 그대로 붙인다(이미지에 넣지 않음).
  batch:
    profiles: ["batch"]
    build:
      context: ..
      dockerfile: deploy/batch.Dockerfile
    volumes:
      - ../data-collection:/app/data-collection
      - ../secrets/ec2-ca.pem:/app/secrets/ec2-ca.pem:ro
      - hf_cache:/home/app/.cache/huggingface
    environment:
      # data-collection/.env 의 값은 Windows 경로라 여기서 덮는다(환경변수가 .env 보다 우선)
      MYSQL_SSL_CA: /app/secrets/ec2-ca.pem
      HF_HUB_OFFLINE: "1"

volumes:
  hf_cache:                     # 임베딩 모델(BGE-M3). 처음 한 번 받는다
  uploads:
  logs:
  caddy_data:
  caddy_config:
