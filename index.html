// 기획서 4-7 유스케이스 표: 종합 평가(9)는 80점 이상이면 바로, 미만이면 확인 절차를
// 거쳐 항상 표현 검수(10)로 이어진다 — "제출 파일 내려받기"가 아니다. 다운로드는
// 검수 화면에 함께 있다(목업 수정 요청서 v3 §3 — 화면을 쪼갤 이유가 없다).
// 목업 수정 요청서 v3 §2: "선택한 층에 따라 뒤에서 도는 게 다르다... 고르지 않은
// 층의 점수는 그대로 승계된다. 화면에서는 갱신된 총점만 보이면 된다." docOutcome·
// artifactOutcome은 App 레벨 상태다 — FinalVerdict 안에 지역 상태로 두면 재작성한
// 뒤 표현 검수 화면으로 넘어갈 때(App이 그 상태를 모르니) 갱신된 값이 사라진다.
// ARTIFACT_SCORE_BY_OUTCOME.pass가 시연 로그의 실제 재작성 후 값(26/30)과 같아서,
// 이 방식이 곧 시연 로그의 진행(71→79→86)을 그대로 재현한다(문서층만 재작성:
// 52+19=71→60+19=79, 둘 다 재작성: →60+26=86).
function FinalVerdict({ announcement, itemInfo, onBack, onProceed, docOutcome, artifactOutcome, setDocOutcome, setArtifactOutcome }){
  const docScore = DOC_SCORE_BY_OUTCOME[docOutcome];
  const artifactScore = ARTIFACT_SCORE_BY_OUTCOME[artifactOutcome];
  const artifactRawTotal = artifactScore.autoCheck.raw + artifactScore.crossCheck.raw;
  const finalTotal = docScore.raw + artifactRawTotal;
  const passed = finalTotal >= FINAL_THRESHOLD;
  // E9: 산출물층을 이미 최선까지 재작성했는데도(더 오를 여지가 없는데도) 총점이
  // 기준에 못 미치면, 프로토타입만 다시 만들어선 기준에 이를 수 없다 — 버튼을
  // 막지는 않되 계획서 항목도 함께 고르라고 안내한다.
  const showE9Hint = !passed && artifactOutcome === 'pass';
  // 되돌릴 수 없음 확인 절차(시연 로그 steps[10].data.choices[1].confirm)에 쓸 짧은
  // 항목별 미달 요약 — "실현가능성 13/20"처럼 항목명+점수로 간결하게 늘어놓는다.
  const remainingShortfalls = [
    ...docScore.items.filter((it) => it.score < it.max).map((it) => `${it.name} ${it.score}/${it.max}`),
    ...artifactScore.autoCheck.reasons,
    ...artifactScore.crossCheck.reasons,
  ];

  const category = detectItemCategory(itemInfo && itemInfo.item);
  const hasExecutable = category !== 'onepage';
  const allTasks = [
    ...WRITING_SUBTASKS.map((label) => ({ label, layer: '계획서' })),
    ...(ARTIFACT_SUBTASKS_BY_CATEGORY[category] || ARTIFACT_SUBTASKS_BY_CATEGORY.webdev).map((label) => ({ label, layer: '프로토타입' })),
  ];

  const [checkedTasks, setCheckedTasks] = useState([]);
  const [runningTasks, setRunningTasks] = useState([]);
  const [viewerOpen, setViewerOpen] = useState(null); // null | 'plan' | 'artifact'
  // 상단 "계획서 보기"/"프로토타입 열기" 버튼은 지금 상태 하나만 보여주면 되지만,
  // 재작성 직후에 여는 모달은 "뭐가 바뀌었는지" 보여주는 자리라 전/후를 나란히
  // 비교해야 한다(사용자 요청) — 같은 모달을 두 모드로 쓴다.
  const [viewerCompare, setViewerCompare] = useState(false);
  const [confirmProceed, setConfirmProceed] = useState(false);
  const [reworkDiff, setReworkDiff] = useState(null); // null 이전엔 한 번도 재작성 안 함
  const [diffExpanded, setDiffExpanded] = useState(false);
  const [reworkFromTotal, setReworkFromTotal] = useState(null); // 변경 내역 헤더의 "X → Y" 중 X

  useEffect(() => {
    if (!viewerOpen) return;
    const onKey = (e) => { if (e.key === 'Escape') setViewerOpen(null); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [viewerOpen]);

  const toggleTask = (label) => {
    setCheckedTasks((prev) => (prev.includes(label) ? prev.filter((t) => t !== label) : [...prev, label]));
  };
  // 실제 재생성 파이프라인은 없는 목업이라, 체크한 항목을 잠깐 "재작성 중"으로
  // 보여준 뒤 되돌린다 — PlanForm/ArtifactResult와 같은 국소 시뮬레이션 패턴. 완료되면
  // "변경 내역"을 채운다(고른 항목만이 아니라 전체 Task를 넣어, 승계된(고르지 않은)
  // 항목도 "변경 없음"으로 함께 보여준다). 목업 수정 요청서 v3 §2가 정확히 "바뀐
  // 항목을 접힌 형태로 제시하고 펼치면 전후 대비가 나오게 한다"고 못 박아서,
  // 여기서 자동으로 펼치지 않는다 — 접힌 채로 두고 사용자가 직접 펼쳐야 한다.
  // 재작성된 층의 결과물은 곧바로 모달로 띄운다(사용자 요청) — 다시 만든 결과가
  // 실제로 뭐가 나왔는지 계획서·프로토타입 화면으로 바로 보여준다. 두 층을 함께
  // 골랐을 때 하나만(프로토타입) 보여주고 종합 판정으로 넘어가 버리면 계획서 쪽
  // 대조 결과를 놓친다(사용자 지적) — viewerOpen을 'both'로 두고, 모달 안에서
  // 계획서·프로토타입 비교를 위아래로 둘 다 보여준다.
  const handleRewrite = () => {
    if (checkedTasks.length === 0) return;
    const picked = checkedTasks;
    const pickedLayers = new Set(allTasks.filter((t) => picked.includes(t.label)).map((t) => t.layer));
    const fromTotal = finalTotal; // 재작성 전 총점 — 변경 내역 헤더의 "X → Y" 중 X
    setRunningTasks(picked);
    setCheckedTasks([]);
    setTimeout(() => {
      setRunningTasks([]);
      setReworkDiff(allTasks.map(({ label, layer }) => {
        const changed = picked.includes(label);
        const summary = TASK_REWORK_SUMMARY[label] || { before: '변경 없음', after: '변경 없음' };
        return changed
          ? { label, layer, before: summary.before, after: summary.after, changed: true }
          : { label, layer, before: '변경 없음', after: '변경 없음', changed: false };
      }));
      setReworkFromTotal(fromTotal);
      // 고른 층만 점수를 올린다 — 고르지 않은 층은 그대로 승계된다(v3 §2). ARTIFACT_
      // SCORE_BY_OUTCOME.pass/DOC_SCORE_BY_OUTCOME.pass가 시연 로그의 실제 재작성-후
      // 값이라, 이 전환이 곧 시연 로그가 보여준 점수 진행 그 자체가 된다.
      if (pickedLayers.has('계획서')) setDocOutcome('pass');
      if (pickedLayers.has('프로토타입')) setArtifactOutcome('pass');
      setViewerCompare(true);
      setViewerOpen(
        pickedLayers.has('계획서') && pickedLayers.has('프로토타입') ? 'both'
          : pickedLayers.has('프로토타입') ? 'artifact' : 'plan'
      );
    }, 1600);
  };

  // 기준 이상이면 곧장 검수로, 미달이면 되돌릴 수 없음을 확인받은 뒤에만 검수로 넘어간다(E4).
  const handleProceedClick = () => {
    if (passed) { onProceed(); return; }
    setConfirmProceed(true);
  };

  return (
    <section className="max-w-3xl mx-auto px-6 py-16">
      <div className="flex items-center justify-between gap-4 flex-wrap mb-6">
        <button onClick={onBack} className="text-[13.5px] font-semibold text-[var(--primary)] hover:underline transition-[scale] duration-150 ease-out active:scale-[0.96]">
          ‹ 산출물로 돌아가기
        </button>
        <div className="flex items-center gap-4">
          <button onClick={() => { setViewerCompare(false); setViewerOpen('plan'); }} className="text-[13px] font-semibold text-[var(--fg)] hover:text-[var(--primary)] transition-colors">계획서 보기</button>
          {hasExecutable && (
            <button onClick={() => { setViewerCompare(false); setViewerOpen('artifact'); }} className="text-[13px] font-semibold text-[var(--fg)] hover:text-[var(--primary)] transition-colors">프로토타입 열기</button>
          )}
        </div>
      </div>

      <p className="text-[13px] font-semibold text-[var(--primary-dim)] tracking-wide mb-2">종합 평가</p>
      <h1 className="font-display font-bold text-[26px] md:text-[30px] mb-3">『{announcement ? announcement.title : ''}』 제출 적합도 결과입니다</h1>
      <p className="text-[14.5px] text-[var(--muted-fg)] mb-8">사업계획서(문서층 70점)와 프로토타입(산출물층 30점)을 합친 총점입니다</p>

      <div className={`rounded-2xl p-6 flex items-center justify-between gap-4 flex-wrap mb-6 ${passed ? 'bg-[color-mix(in_srgb,var(--ok)_8%,white)] border border-[var(--border)]' : 'bg-[color-mix(in_srgb,var(--danger)_6%,white)] border border-[var(--danger)]'}`}>
        <div>
          <p className="text-[12px] font-semibold text-[var(--muted-fg)] mb-1">종합 판정</p>
          <p className={`font-display font-bold text-[20px] ${passed ? 'text-[var(--ok)]' : 'text-[var(--danger)]'}`}>
            {passed ? '이 공고에 제출 가능합니다' : '아직 제출 기준에 못 미칩니다'}
          </p>
        </div>
        <div className="flex items-end gap-1.5">
          <p className={`font-display font-bold text-[32px] leading-none ${passed ? 'text-[var(--ok)]' : 'text-[var(--danger)]'}`}>{finalTotal}</p>
          <p className="text-[13px] text-[var(--muted-fg)] mb-0.5">/ 100점 (Threshold {FINAL_THRESHOLD})</p>
        </div>
      </div>

      <div className="grid sm:grid-cols-2 gap-4 mb-6">
        <div className="rounded-2xl border border-[var(--border)] bg-white p-5">
          <p className="text-[12.5px] font-semibold text-[var(--muted-fg)] mb-3">문서층 내역</p>
          <p className="font-display font-bold text-[24px] leading-none mb-1">{docScore.raw} <span className="text-[13px] font-semibold text-[var(--muted-fg)]">/ {docScore.max}점</span></p>
          <p className="text-[12px] text-[var(--muted-fg)]">LLM 판정 — 계획서 평가항목 충족 여부</p>
        </div>
        <div className="rounded-2xl border border-[var(--border)] bg-white p-5">
          <p className="text-[12.5px] font-semibold text-[var(--muted-fg)] mb-3">산출물층 내역</p>
          <p className="font-display font-bold text-[24px] leading-none mb-1">{artifactRawTotal} <span className="text-[13px] font-semibold text-[var(--muted-fg)]">/ 30점</span></p>
          <p className="text-[12px] text-[var(--muted-fg)]">자동 검증 {artifactScore.autoCheck.raw}/{artifactScore.autoCheck.max} · 계획서 대조 {artifactScore.crossCheck.raw}/{artifactScore.crossCheck.max}</p>
        </div>
      </div>

      <p className="text-[11px] text-[var(--muted-fg)] leading-relaxed mb-6">{SCORE_DISCLAIMER}</p>

      {showE9Hint && (
        <div className="rounded-xl border border-[var(--border)] bg-[var(--muted)] p-4 mb-6">
          <p className="text-[12.5px] text-[var(--fg)] leading-relaxed">산출물층은 이미 최선까지 재작성했습니다 — 아래 목록에서 계획서 항목도 함께 선택해야 기준에 이릅니다.</p>
        </div>
      )}

      {!passed && (
        <div className="rounded-2xl border border-[var(--border)] p-5 mb-6">
          <p className="text-[12.5px] font-bold text-[var(--danger)] mb-3">보완이 필요한 항목</p>
          <div className="flex flex-col gap-2.5 mb-4">
            {allTasks.map(({ label, layer }) => {
              const isRunning = runningTasks.includes(label);
              const reasons = taskReasons(label, docScore, artifactScore);
              return (
                <label key={label} className={`flex items-start gap-2.5 text-[13px] ${isRunning ? 'text-[var(--muted-fg)]' : 'text-[var(--fg)] cursor-pointer'}`}>
                  {isRunning ? (
                    <span className="flex-shrink-0 mt-0.5 w-4 h-4 rounded-full border-2 border-[var(--muted)] border-t-[var(--primary)] animate-spin" aria-hidden="true"></span>
                  ) : (
                    <input type="checkbox" checked={checkedTasks.includes(label)} onChange={() => toggleTask(label)}
                      className="flex-shrink-0 mt-0.5 w-4 h-4 accent-[var(--primary)]" />
                  )}
                  <span>
                    <span className="flex-shrink-0 text-[11px] font-semibold text-[var(--muted-fg)] mr-1.5">［{layer}］</span>
                    {isRunning ? `${label} 재작성 중…` : label}
                    {!isRunning && reasons.map((r) => (
                      <span key={r} className="block text-[12px] text-[var(--muted-fg)] mt-0.5">{r}</span>
                    ))}
                  </span>
                </label>
              );
            })}
          </div>
          <div className="flex items-center gap-3 flex-wrap">
            <button onClick={handleRewrite} disabled={checkedTasks.length === 0 || runningTasks.length > 0}
              className="rounded-lg border border-[var(--border)] px-4 py-2.5 text-[13.5px] font-semibold disabled:opacity-40 disabled:cursor-not-allowed hover:bg-[var(--bg)] transition-[background-color,scale] duration-150 ease-out active:scale-[0.98]">
              선택 항목 다시 만들기
            </button>
            <button onClick={handleProceedClick}
              className="rounded-lg px-4 py-2.5 text-[13.5px] font-semibold text-[var(--primary)] hover:underline transition-[scale] duration-150 ease-out active:scale-[0.96]">
              이대로 진행하기
            </button>
          </div>
        </div>
      )}

      {/* 변경 내역은 재작성으로 기준을 넘겨 !passed 카드가 사라진 뒤에도 계속 보여야
          한다 — v3 §2 예시가 "86점 · 통과 (79 → 86)"처럼 통과 상태에서도 방금 무엇이
          바뀌었는지 보여주므로, passed 여부와 무관하게 reworkDiff가 있으면 렌더링한다. */}
      {reworkDiff && (
        <div className="rounded-2xl border border-[var(--border)] p-5 mb-6">
          <p className="text-[13px] font-semibold mb-3">
            {finalTotal}점 · {passed ? '통과' : '미달'}
            {reworkFromTotal !== null && reworkFromTotal !== finalTotal && (
              <span className="text-[var(--muted-fg)] font-normal"> ({reworkFromTotal} → {finalTotal})</span>
            )}
          </p>
          <button onClick={() => setDiffExpanded((v) => !v)}
            className="text-[12.5px] font-semibold text-[var(--muted-fg)] hover:text-[var(--fg)] transition-colors">
            {diffExpanded ? '▾' : '▸'} 변경 내역 — {reworkDiff.filter((d) => d.changed).length}개 항목 변경됨
          </button>
          {diffExpanded && (
            <ul className="mt-2 flex flex-col gap-1.5">
              {reworkDiff.map((d) => (
                <li key={d.label} className="text-[12.5px] text-[var(--fg)] leading-relaxed">
                  <span className="text-[11px] font-semibold text-[var(--muted-fg)] mr-1.5">［{d.layer}］</span>
                  {d.label} — {d.changed ? <React.Fragment><span className="text-[var(--muted-fg)]">{d.before}</span> → {d.after}</React.Fragment> : <span className="text-[var(--muted-fg)]">변경 없음</span>}
                </li>
              ))}
            </ul>
          )}
        </div>
      )}

      {confirmProceed && (
        <div className="rounded-2xl border border-[var(--danger)] bg-[color-mix(in_srgb,var(--danger)_6%,white)] p-5 mb-6">
          <p className="text-[13px] font-bold text-[var(--danger)] mb-3">기준 미달 상태로 진행합니다 — 이 단계부터는 되돌릴 수 없습니다</p>
          <ul className="flex flex-col gap-1.5 mb-4">
            <li className="text-[12.5px] text-[var(--fg)] leading-relaxed">· 현재 점수 — 총점 {finalTotal}점 · 기준 {FINAL_THRESHOLD}점 미달</li>
            <li className="text-[12.5px] text-[var(--fg)] leading-relaxed">· 남는 미달 항목 — {remainingShortfalls.join(', ')}</li>
            <li className="text-[12.5px] text-[var(--fg)] leading-relaxed">· 진행 후에는 다시 만들 수 없습니다. 검수 단계로 넘어가면 이 점수가 그대로 확정됩니다.</li>
          </ul>
          <div className="flex items-center gap-4">
            <button onClick={() => setConfirmProceed(false)}
              className="text-[13px] font-semibold text-[var(--muted-fg)] hover:text-[var(--fg)] transition-[color,scale] duration-150 ease-out active:scale-[0.96]">
              취소
            </button>
            <button onClick={onProceed}
              className="text-[13px] font-semibold text-[var(--danger)] hover:underline transition-[scale] duration-150 ease-out active:scale-[0.96]">
              그래도 진행하기
            </button>
          </div>
        </div>
      )}

      {passed && (
        <button onClick={handleProceedClick}
          className="w-full rounded-xl bg-[var(--primary)] text-white py-3.5 text-[15px] font-semibold hover:bg-[var(--primary-dim)] transition-[background-color,scale] duration-150 ease-out active:scale-[0.98]">
          검수하기
        </button>
      )}

      {/* 재작성 직후 자동으로 여는 모달은 "지금 상태" 하나만 보여주면 뭐가 바뀌었는지
          알 수 없다(사용자 지적) — viewerCompare가 true면 재작성 전/후 문서를 나란히
          보여준다. "전" 쪽은 항상 원본 고정값(PLAN_DOCUMENT_SECTIONS, ARTIFACT_SCORE_
          BY_OUTCOME.fail)을 쓴다 — 재작성 후엔 실제 docOutcome/artifactOutcome이
          이미 'pass'로 바뀌어 있어서 라이브 상태로는 "전" 모습을 더 이상 알 수 없다. */}
      {viewerOpen && (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-6" role="dialog" aria-modal="true">
          <div className="absolute inset-0 bg-black/40" onClick={() => setViewerOpen(null)}></div>
          <div className={`relative bg-white rounded-2xl w-full max-h-[85vh] overflow-y-auto p-6 shadow-2xl ${viewerCompare ? 'max-w-4xl' : 'max-w-2xl'}`}>
            <div className="flex items-center justify-between mb-5">
              <p className="font-display font-bold text-[18px]">
                {viewerOpen === 'both' ? '사업계획서 · 프로토타입' : viewerOpen === 'plan' ? '사업계획서' : '프로토타입'}
                {viewerCompare ? ' — 재작성 전/후 비교' : ''}
              </p>
              <button onClick={() => setViewerOpen(null)} aria-label="닫기"
                className="text-[13px] font-semibold text-[var(--muted-fg)] hover:text-[var(--fg)] transition-colors">닫기 ✕</button>
            </div>

            {(viewerOpen === 'plan' || viewerOpen === 'both') && (
              <p className="text-[11px] text-[var(--muted-fg)] mb-4 pb-4 border-b border-[var(--border)]">{PLAN_AI_NOTICE}</p>
            )}

            {!viewerCompare && (
              viewerOpen === 'plan' ? (
                <div className="flex flex-col gap-6">
                  {PLAN_DOCUMENT_SECTIONS.map((s, i) => (
                    <div key={s.title}>
                      <p className="text-[11px] font-bold text-[var(--muted-fg)] tracking-wide mb-1">［{s.tag}］</p>
                      <h2 className="font-display font-bold text-[15px] mb-1.5">{String(i + 1).padStart(2, '0')}. {s.title}</h2>
                      <p className="text-[13px] leading-relaxed text-[var(--fg)]">{s.body}</p>
                    </div>
                  ))}
                </div>
              ) : (
                <div className="relative aspect-[4/3] rounded-xl overflow-hidden border border-[var(--border)]">
                  {hasExecutable ? <SiteMock /> : <InfographicMock />}
                </div>
              )
            )}

            {/* 두 층을 함께 재작성했으면(viewerOpen==='both') 모달 하나에 계획서·프로토타입
                비교를 위아래로 둘 다 보여준다 — 프로토타입만 보여주고 바로 종합 판정으로
                넘어가면 계획서 쪽 대조 결과를 놓친다(사용자 지적). */}
            {viewerCompare && viewerOpen === 'plan' && <PlanCompareColumns />}
            {viewerCompare && viewerOpen === 'artifact' && <ArtifactCompareColumns hasExecutable={hasExecutable} />}
            {viewerCompare && viewerOpen === 'both' && (
              <div className="flex flex-col gap-8">
                <div>
                  <p className="font-display font-bold text-[15px] mb-4">사업계획서</p>
                  <PlanCompareColumns />
                </div>
                <div className="pt-8 border-t border-[var(--border)]">
                  <p className="font-display font-bold text-[15px] mb-4">프로토타입</p>
                  <ArtifactCompareColumns hasExecutable={hasExecutable} />
                </div>
              </div>
            )}
          </div>
        </div>
      )}
    </section>
  );
}

  { label: '계획서', text: '본 문서는 S-Brain이 생성한 초안입니다. 제출 전 작성자 본인의 확인과 수정이 필요합니다.' },

// 검수 단계 진입은 되돌릴 수 없다(기획서 4-7) — 종합 평가로 돌아가는 경로를 두지
// 않는다. 그래서 이 화면에는 뒤로가기 버튼이 없다(다른 모든 파이프라인 화면과의
// 유일한 차이). 다운로드도 이 화면 하단에 함께 둔다 — 목업 수정 요청서 v3 §3:
// "검수와 내려받기를 별도 단계로 세지만 화면을 쪼갤 이유는 없다."
// 점수는 다시 표시하지 않는다 — 검수가 점수를 바꾼 것처럼 보이면 안 되기 때문에,
// 종합 평가에서 본 점수가 최종이라는 사실이 화면에서도 드러나야 한다(v3 §3).
function ReviewScreen({ announcement, docOutcome = 'fail', artifactOutcome = 'fail', onGoDashboard }){
  const docScore = DOC_SCORE_BY_OUTCOME[docOutcome];
  const artifactScore = ARTIFACT_SCORE_BY_OUTCOME[artifactOutcome];
  const finalTotal = docScore.raw + artifactScore.autoCheck.raw + artifactScore.crossCheck.raw;
  const passed = finalTotal >= FINAL_THRESHOLD;

  return (
    <section className="max-w-3xl mx-auto px-6 py-16">
      <p className="text-[13px] font-semibold text-[var(--primary-dim)] tracking-wide mb-2">표현 검수</p>
      <h1 className="font-display font-bold text-[26px] md:text-[30px] mb-3">『{announcement ? announcement.title : ''}』 문장을 다듬었습니다</h1>
      <p className="text-[14.5px] text-[var(--muted-fg)] mb-1">사업계획서 문장 형식과 한국어 표현만 다듬는 단계라 점수는 바뀌지 않습니다</p>
      <p className="text-[12.5px] text-[var(--muted-fg)] mb-8">이 단계부터는 이전 화면으로 돌아갈 수 없습니다</p>

      <div className="flex flex-col gap-4 mb-10">
        {REVIEW_PARAGRAPHS.map((p) => (
          <div key={p.id} className={`rounded-2xl border bg-white p-5 ${p.spotlight ? 'border-[var(--primary)]' : 'border-[var(--border)]'}`}>
            <div className="flex items-center justify-between gap-3 mb-3 flex-wrap">
              <p className="text-[11px] font-bold text-[var(--muted-fg)] tracking-wide font-mono">{p.id}</p>
              {!p.spotlight && (
                <span className="flex-shrink-0 text-[11px] font-semibold text-[var(--ok)] bg-[color-mix(in_srgb,var(--ok)_12%,white)] rounded-full px-2.5 py-1">표현 반영됨</span>
              )}
            </div>

            {p.spotlight ? (
              <React.Fragment>
                <p className="text-[11px] font-semibold text-[var(--muted-fg)] mb-1.5">원문</p>

// 각 항목의 view는 "실제로 그 단계까지 갔다면 보일 화면"에 대응시켜서, 목록에서
// 클릭했을 때 해당 프로젝트의 진행 단계로 바로 이어지는 걸 흉내낸다.
const MY_PROJECTS = [
  { id: 1, name: '동네 헬스장 예약 서비스', announcementTitle: '초기창업패키지', status: '사업계획서 작성중', progress: 65, updatedAt: '2026-09-08', view: 'plan-form' },
  { id: 5, name: '중고거래 안전결제 플랫폼', announcementTitle: '예비창업패키지', status: '제출 완료', progress: 100, updatedAt: '2026-08-20', view: 'review', scoreOutcome: 'pass' },
];

const PROJECT_PAGE_SIZE = 5;
const PROJECT_STATUS_TONE = {
  ok: { color: '#3D7A4F', bg: 'rgba(61,122,79,.12)' },
  danger: { color: '#A8342A', bg: 'rgba(168,52,42,.1)' },
  neutral: { color: '#5C5648', bg: '#EFE7D8' },
};
function projectStatusTone(status){
  if (/완료|통과/.test(status)) return PROJECT_STATUS_TONE.ok;
  if (/미달|불통과/.test(status)) return PROJECT_STATUS_TONE.danger;
  return PROJECT_STATUS_TONE.neutral;
}

// 제한 대상이 아니고, 그 외 상태는 전부 "진행 중"으로 본다.
const COMPLETED_PROJECT_STATUS = '제출 완료';

// 완전히 처음 로그인한 유저는 등록한 프로젝트가 하나도 없다 — 기존에 만든
// 대시보드는 전부 MY_PROJECTS(더미 7건)를 전제로 하고 있어서 그 빈 상태를 보여줄
// 방법이 없었다. 실제 신규가입 절차를 또 만드는 대신(로그인 자체는 목업이라 계정을
// 여러 개 둘 이유가 없다), 대시보드 진입 시점에 "어느 페르소나로 볼지"만 전환하는
// 가벼운 토글을 둔다 — 발표자가 그 자리에서 신규/기존 화면을 바로 오가며 보여줄 수 있다.
function ProjectDashboard({ onNewProject, onOpenProject, notifyEnabled, alerts, isNewUser, onToggleNewUser }){
  const [query, setQuery] = useState('');
  const [page, setPage] = useState(1);
  // E8: 진행 중인 프로젝트가 있는 상태에서 새 프로젝트를 시작하려 하면 그냥 막지
  // 않고 현재 단계를 보여준 뒤 이어하기/중단 후 새로 시작 중 고르게 한다 — 막기만
  // 하면 사용자는 왜 안 되는지 모른다. 신규 유저는 애초부터 진행 중인 게 없으니
  // 이 가드 자체가 조건 없이 통과한다.
  const [showGuard, setShowGuard] = useState(false);
  const projects = isNewUser ? [] : MY_PROJECTS;
  const inProgressProject = projects.find((p) => p.status !== COMPLETED_PROJECT_STATUS) || null;

  const handleNewProjectClick = () => {
    if (inProgressProject) { setShowGuard(true); return; }
    onNewProject();
  };

  // 검색 키워드는 프로젝트명 또는 기준 공고명 — 둘 중 하나만 걸려도 노출한다.
  const filtered = projects.filter((p) => {
    const q = query.trim().toLowerCase();
    if (!q) return true;
    return p.name.toLowerCase().includes(q) || (p.announcementTitle || '').toLowerCase().includes(q);
  });
  const totalPages = Math.max(1, Math.ceil(filtered.length / PROJECT_PAGE_SIZE));
  const pageItems = filtered.slice((page - 1) * PROJECT_PAGE_SIZE, page * PROJECT_PAGE_SIZE);
  const activeAlerts = notifyEnabled ? alerts : [];

  const handleQueryChange = (e) => { setQuery(e.target.value); setPage(1); };

  return (
    <section className="max-w-5xl mx-auto px-6 py-16">
      <div className="flex items-center justify-end gap-2 mb-4">
        <span className="text-[11px] text-[var(--muted-fg)]">시연용 화면 전환</span>
        <div className="inline-flex rounded-lg border border-[var(--border)] p-0.5">
          {[[false, '기존 유저'], [true, '신규 유저']].map(([val, label]) => (
            <button key={label} onClick={() => onToggleNewUser(val)}
              className={`px-3 py-1.5 rounded-md text-[12px] font-semibold transition-[background-color,color] duration-150 ease-out ${isNewUser === val ? 'bg-[var(--primary)] text-white' : 'text-[var(--muted-fg)] hover:text-[var(--fg)]'}`}>
              {label}
            </button>
          ))}
        </div>
      </div>

      <div className="flex items-start justify-between gap-4 flex-wrap mb-8">
        <div>
          <p className="text-[13px] font-semibold text-[var(--primary-dim)] tracking-wide mb-2">내 프로젝트</p>
          <h1 className="font-display font-bold text-[26px] md:text-[30px]">
            {isNewUser ? '아직 시작한 프로젝트가 없어요' : `진행 중인 프로젝트 ${projects.length}건`}
          </h1>
        </div>
        <button onClick={handleNewProjectClick}
          className="rounded-xl bg-[var(--primary)] text-white px-5 py-3 text-[14px] font-semibold hover:bg-[var(--primary-dim)] transition-[background-color,scale] duration-150 ease-out active:scale-[0.97]">
          + 새 프로젝트 시작하기
        </button>
      </div>

      {isNewUser ? (
        <div className="rounded-2xl border border-dashed border-[var(--border)] bg-white px-6 py-16 flex flex-col items-center text-center">
          <svg className="w-11 h-11 text-[var(--muted-fg)] mb-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <path d="M14 2v6h6"/>
            <path d="M12 18v-6M9 15h6"/>
          </svg>
          <p className="font-display font-bold text-[17px] mb-2">아이템 한 줄이면 충분합니다</p>
          <p className="text-[13.5px] text-[var(--muted-fg)] max-w-sm leading-relaxed mb-6">
            공고 매칭부터 사업계획서, 프로토타입까지 한 번에 만들어드려요 — 첫 프로젝트를 시작해보세요
          </p>
          <button onClick={handleNewProjectClick}
            className="rounded-xl bg-[var(--primary)] text-white px-6 py-3 text-[14.5px] font-semibold hover:bg-[var(--primary-dim)] transition-[background-color,scale] duration-150 ease-out active:scale-[0.97]">
            + 첫 프로젝트 시작하기
          </button>
        </div>
      ) : (
      <React.Fragment>
      {showGuard && inProgressProject && (
        <div className="rounded-2xl border border-[var(--primary)] bg-[color-mix(in_srgb,var(--primary)_6%,white)] p-5 mb-6">
          <p className="text-[13.5px] font-semibold mb-1">진행 중인 프로젝트가 있습니다 — 실행은 계정당 1건입니다</p>
          <p className="text-[13px] text-[var(--fg)] mb-4">『{inProgressProject.name}』 · {inProgressProject.status} ({inProgressProject.progress}%)</p>
          <div className="flex items-center gap-3 flex-wrap">
            <button onClick={() => { setShowGuard(false); onOpenProject(inProgressProject); }}
              className="rounded-lg bg-[var(--primary)] text-white px-4 py-2 text-[13px] font-semibold hover:bg-[var(--primary-dim)] transition-[background-color,scale] duration-150 ease-out active:scale-[0.97]">
              이어하기
            </button>
            <button onClick={() => { setShowGuard(false); onNewProject(); }}
              className="rounded-lg border border-[var(--border)] px-4 py-2 text-[13px] font-semibold hover:bg-white transition-[background-color,scale] duration-150 ease-out active:scale-[0.97]">
              중단 후 새로 시작하기
            </button>
            <button onClick={() => setShowGuard(false)}
              className="text-[13px] font-semibold text-[var(--muted-fg)] hover:text-[var(--fg)] transition-colors">
              취소
            </button>
          </div>
        </div>
      )}

      {/* 페이지 내 알림 — 등록한 프로젝트와 유사한 신규 공고가 있을 때만 노출 */}
      {activeAlerts.length > 0 && (
        <div className="rounded-xl border border-[var(--border)] px-5 py-3.5 mb-6 flex items-center gap-3" style={{ backgroundColor: 'color-mix(in srgb, var(--primary) 7%, white)' }}>
          <span className="w-2 h-2 rounded-full bg-[var(--primary)] flex-shrink-0"></span>
          <p className="text-[13px]">등록한 프로젝트와 유사한 신규 공고 <b>{activeAlerts.length}건</b>이 올라왔어요 — 우측 상단 알림 벨에서 확인하세요</p>
        </div>
      )}

      <div className="relative mb-6 max-w-sm">
        <svg className="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-[var(--muted-fg)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
        </svg>
        <input value={query} onChange={handleQueryChange} placeholder="프로젝트명 또는 공고명으로 검색"
          className="w-full border border-[var(--border)] rounded-xl pl-10 pr-4 py-2.5 text-[13.5px] bg-white focus:border-[var(--primary)] focus:border-2 outline-none transition-colors placeholder:text-[var(--muted-fg)]" />
      </div>

      <div className="rounded-2xl border border-[var(--border)] bg-white overflow-hidden">
        <div className="hidden sm:grid grid-cols-[2fr_1.4fr_1fr_1fr_1fr] text-[12px] font-semibold text-[var(--muted-fg)] bg-[var(--muted)] px-6 py-3">
          <div>프로젝트명</div><div>기준 공고</div><div>상태</div><div>진행률</div><div>최근 수정</div>
        </div>
        {pageItems.length === 0 ? (
          <p className="px-6 py-10 text-center text-[13px] text-[var(--muted-fg)]">검색 결과가 없습니다</p>
        ) : pageItems.map((p) => {
          const tone = projectStatusTone(p.status);
          return (
            <button key={p.id} onClick={() => onOpenProject(p)}
              className="w-full grid grid-cols-2 sm:grid-cols-[2fr_1.4fr_1fr_1fr_1fr] gap-y-1.5 items-center text-left px-6 py-4 border-t border-[var(--border)] hover:bg-[var(--bg)] transition-colors duration-150 ease-out">
              <span className="col-span-2 sm:col-span-1 font-semibold text-[13.5px] truncate pr-2">{p.name}</span>
              <span className="text-[13px] text-[var(--muted-fg)] truncate pr-2">{p.announcementTitle || '미선택'}</span>
              <span className="text-[12px] font-bold w-fit rounded-full px-2.5 py-1" style={{ color: tone.color, backgroundColor: tone.bg }}>
                {p.status}
              </span>
              <span className="flex items-center gap-2">
                <span className="flex-1 h-1.5 rounded-full bg-[var(--muted)] overflow-hidden max-w-[60px]">
                  <span className="block h-full rounded-full bg-[var(--primary)]" style={{ width: `${p.progress}%` }}></span>
                </span>
                <span className="text-[11.5px] text-[var(--muted-fg)] font-mono">{p.progress}%</span>
              </span>
              <span className="text-[12.5px] text-[var(--muted-fg)] font-mono">{p.updatedAt}</span>
            </button>
          );
        })}
      </div>

      {totalPages > 1 && (
        <div className="flex items-center justify-center gap-1.5 mt-6">
          <button onClick={() => setPage((p) => Math.max(1, p - 1))} disabled={page === 1}
            className="w-8 h-8 rounded-lg border border-[var(--border)] text-[13px] disabled:opacity-30 disabled:cursor-not-allowed hover:bg-[var(--bg)] transition-colors duration-150 ease-out">‹</button>
          {Array.from({ length: totalPages }, (_, i) => i + 1).map((n) => (
            <button key={n} onClick={() => setPage(n)}
              className={`w-8 h-8 rounded-lg text-[13px] font-semibold transition-colors duration-150 ease-out ${n === page ? 'bg-[var(--primary)] text-white' : 'border border-[var(--border)] hover:bg-[var(--bg)]'}`}>
              {n}
            </button>
          ))}
          <button onClick={() => setPage((p) => Math.min(totalPages, p + 1))} disabled={page === totalPages}
            className="w-8 h-8 rounded-lg border border-[var(--border)] text-[13px] disabled:opacity-30 disabled:cursor-not-allowed hover:bg-[var(--bg)] transition-colors duration-150 ease-out">›</button>
        </div>
      )}
      </React.Fragment>
      )}
    </section>
  );
}

function App(){
  const [loginOpen, setLoginOpen] = useState(false);
  const [user, setUser] = useState(null);
  const [view, setView] = useState('landing');
  // 'landing' | 'dashboard' | 'intake' | 'match-progress' | 'match-results' |
  // 'eligibility-gate' | 'plan-form' | 'artifact-result' | 'final-verdict' |
  // 'review' (표현 검수 + 결과물 다운로드) — 생성 진행 상황은 더 이상 별도 화면이
  // 아니라 EligibilityGate/PlanForm 안의 블러 모달이라 독립된 view가 없다.
  // 기획서 4-2①: 신청자 유형·대표자·설립일자·아이디어·팀·단가를 한 화면(intake)에서
  // 한 번에 받는다 — 자격 게이트 이후로는 사용자에게 되묻지 않기 위함. 로그인 후
  // "시작하기"는 바로 새 프로젝트로 들어가지 않고 내 프로젝트 목록(dashboard)을
  // 먼저 보여준다.
  const [startTypeInfo, setStartTypeInfo] = useState(null);
  const [itemInfo, setItemInfo] = useState(null);
  const [announcement, setAnnouncement] = useState(null);
  const [planDetails, setPlanDetails] = useState(null);
  // 자격요건 게이트에서 불통과를 직접 확인하고 나온 공고 제목만 담는다 — 매칭 결과
  // 화면에서 이 목록에 있는 공고만 비활성화한다(미리 판정해서 꺼두지 않는다).
  const [checkedFailedTitles, setCheckedFailedTitles] = useState([]);
  // 유사 공고 알림 on/off — 벨 드롭다운과 대시보드 인페이지 배너가 이 값 하나를 같이 본다.
  const [notifyEnabled, setNotifyEnabled] = useState(true);
  // 시연용 페르소나 전환 — 실제 신규가입 절차 없이 대시보드가 "프로젝트 0건"인
  // 완전 신규 유저 화면을 보여줄 수 있게 한다. ProjectDashboard의 토글이 이 값을 바꾼다.
  const [isNewUser, setIsNewUser] = useState(false);
  // 내 프로젝트 목록에서 진입했는지 여부 — true면 match-results의 뒤로가기가
  // (원래 플로우의 이전 단계 대신) 내 프로젝트로 돌아간다. 새 프로젝트를 처음부터
  // 시작하면 다시 false로 돌려 원래 단계별 뒤로가기 체인을 그대로 쓴다.
  const [returnToDashboard, setReturnToDashboard] = useState(false);
  // 대시보드 목업 프로젝트마다 상태 라벨이 다르므로(예: "제출 완료" vs "검증 미달")
  // 문서/종합 평가 화면이 보여주는 점수도 그 라벨과 맞아야 한다 — 새로 시작하는
  // 플로우는 항상 'fail' 예시(재작성 UI가 실제로 보이도록)를 쓰고, 대시보드에서
  // "제출 완료"로 표시된 프로젝트를 열 때만 'pass'로 바꾼다.
  const [scoreOutcome, setScoreOutcome] = useState('fail');
  // 문서층·산출물층을 층별로 따로 추적한다 — 종합 평가에서 한 층만 재작성해도
  // 그 층만 'pass'로 넘어가고 고르지 않은 층은 그대로 승계돼야 하기 때문이다
  // (목업 수정 요청서 v3 §2). FinalVerdict 안에 지역 상태로 두면 표현 검수
  // 화면으로 넘어갈 때 재작성 결과가 날아가 버려서 App 레벨로 끌어올렸다.
  const [docOutcome, setDocOutcome] = useState('fail');
  const [artifactOutcome, setArtifactOutcome] = useState('fail');
  const resetScoreOutcome = (v) => { setScoreOutcome(v); setDocOutcome(v); setArtifactOutcome(v); };

  // 로그인 안 된 상태면 로그인부터, 이미 로그인돼 있으면 내 프로젝트 목록으로 보낸다.
  const startFlow = () => { if (user) { setView('dashboard'); } else { setLoginOpen(true); } };
  const closeLogin = () => setLoginOpen(false);
  // 로그인은 랜딩에서 시작하기를 눌러야만 열리므로 성공해도 view는 그대로 'landing'에
  // 둔다 — 로그인과 동시에 공고 매칭으로 넘어가면 로그인만 하려던 사용자도 떠밀려
  // 들어가게 된다, 로그인 여부는 Nav에 표시만 하고 진입은 시작하기를 다시 눌러야 한다.
  // consent는 최초 로그인에서만 넘어온다(재로그인 시 undefined) — 그때만 알림 수신
  // 선택 동의 여부를 notifyEnabled 초기값에 반영한다.
  const handleLoginSuccess = (acc, consent) => {
    setUser(acc);
    setLoginOpen(false);
    if (consent) setNotifyEnabled(consent.notifyAgreed);
  };
  const goToDashboard = () => setView('dashboard');
  // 대시보드에서 "+ 새 프로젝트 시작하기"로 들어가는 경우 — 기존 프로젝트를 열람하던
  // 상태가 아니므로 returnToDashboard를 끄고 원래의 단계별 뒤로가기 체인을 쓴다.
  const startNewProject = () => { setReturnToDashboard(false); resetScoreOutcome('fail'); setView('intake'); };
  const handleLogout = () => { setUser(null); setView('landing'); };
  const goHome = () => setView('landing');
  const handleIntakeSubmit = (info) => {
    setStartTypeInfo({ applicantType: info.applicantType });
    setItemInfo({ item: info.item, ceoName: info.ceoName, foundedAt: info.foundedAt, files: info.files });
    setPlanDetails({ team: info.team, pricing: info.pricing });
    setCheckedFailedTitles([]);
    resetScoreOutcome('fail');
    setView('match-progress');
  };
  // 목록에서 프로젝트를 클릭하면 그 프로젝트가 실제로 도달했을 단계 화면으로 바로 이동한다.
  // scoreOutcome도 그 프로젝트 라벨에 맞춰 같이 바꾼다 — "제출 완료"인데 화면은 미달로
  // 나오는 식의 라벨-판정 불일치를 막는다.
  const handleOpenProject = (project) => {
    const matchedAnnouncement = ANNOUNCEMENTS.find((a) => a.title === project.announcementTitle)
      || (project.announcementTitle ? { title: project.announcementTitle } : null);
    setAnnouncement(matchedAnnouncement);
    setItemInfo({ item: project.name, ceoName: '', foundedAt: '' });
    setReturnToDashboard(true);
    resetScoreOutcome(project.scoreOutcome || 'fail');
    setView(project.view);
  };
  const handleCheckEligibility = (r) => { setAnnouncement(r); setView('eligibility-gate'); };
  // 자격요건 게이트를 통과했을 때만 다음으로 넘어간다 — 불통과 시 우회 진행은 없다.
  // 생성 진행 상황은 이제 각 화면(EligibilityGate/PlanForm) 안에서 블러 모달로
  // 보여주므로, 여기서는 완료 후 도착할 다음 화면으로 바로 넘어간다.
  const handleGateProceed = () => setView('plan-form');
  const handleLeaveGate = (title, failed) => {
    if (failed) setCheckedFailedTitles((prev) => (prev.includes(title) ? prev : [...prev, title]));
    setView('match-results');
  };
  const handlePlanGenerate = () => setView('artifact-result');

  if (view !== 'landing') {
    return (
      <React.Fragment>
        <AppBar user={user} onLogout={handleLogout} onHome={goHome}
          notifyEnabled={notifyEnabled} onToggleNotify={() => setNotifyEnabled((v) => !v)} />
        {view === 'dashboard' && (
          <ProjectDashboard onNewProject={startNewProject} onOpenProject={handleOpenProject}
            notifyEnabled={notifyEnabled} alerts={SIMILAR_ANNOUNCEMENT_ALERTS}
            isNewUser={isNewUser} onToggleNewUser={setIsNewUser} />
        )}
        {view === 'intake' && (
          <IntakeForm onSubmit={handleIntakeSubmit} onBack={goToDashboard} backLabel="내 프로젝트로 돌아가기" />
        )}
        {view === 'match-progress' && <MatchProgress onComplete={() => setView('match-results')} />}
        {view === 'match-results' && (
          <MatchResults itemInfo={itemInfo} onBack={() => setView(returnToDashboard ? 'dashboard' : 'intake')}
            backLabel={returnToDashboard ? '내 프로젝트로 돌아가기' : '아이템 정보 다시 입력하기'}
            onCheckEligibility={handleCheckEligibility} disabledTitles={checkedFailedTitles} />
        )}
        {view === 'eligibility-gate' && (
          <EligibilityGate announcement={announcement} itemInfo={itemInfo}
            onProceed={handleGateProceed} onLeave={handleLeaveGate} />
        )}
        {view === 'plan-form' && (
          <PlanForm announcement={announcement} onGenerate={handlePlanGenerate} scoreOutcome={scoreOutcome} itemInfo={itemInfo} />
        )}
        {view === 'artifact-result' && (
          <ArtifactResult announcement={announcement} itemInfo={itemInfo} onBack={() => setView('plan-form')}
            onFinalize={() => setView('final-verdict')} scoreOutcome={scoreOutcome} />
        )}
        {view === 'final-verdict' && (
          <FinalVerdict announcement={announcement} itemInfo={itemInfo} onBack={() => setView('artifact-result')}
            onProceed={() => setView('review')} docOutcome={docOutcome} artifactOutcome={artifactOutcome}
            setDocOutcome={setDocOutcome} setArtifactOutcome={setArtifactOutcome} />
        )}
        {view === 'review' && (
          <ReviewScreen announcement={announcement} docOutcome={docOutcome} artifactOutcome={artifactOutcome} onGoDashboard={goToDashboard} />
        )}
      </React.Fragment>
    );
  }

  return (
    <main className="overflow-x-hidden w-full max-w-full">
      <Nav onLogin={startFlow} user={user} onLogout={handleLogout} />
      <Hero onLogin={startFlow} />
      <Bento />
      <Differentiator />
      <Desire />
      <TrustPreview />
      <Testimonials />
      <ActionFooter onLogin={startFlow} />
      <LoginModal open={loginOpen} onClose={closeLogin} onSuccess={handleLoginSuccess} />
    </main>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
