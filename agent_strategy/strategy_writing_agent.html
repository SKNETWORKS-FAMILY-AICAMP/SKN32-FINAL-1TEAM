type):\n    return plan.resources(item, required_capabilities, team, resource_type)`,calculate_budget:`def calculate_budget(items, quantity, unit_price, phase, rules):\n    return python.check_budget(items, quantity, unit_price, phase, rules)`,create_schedule:`def create_schedule(tasks, duration, milestones):\n    return python.timeline(tasks, duration, milestones)`,generate_section:`def generate_section(section_spec, source_data, writing_rules):\n    return llm.text(section_spec, source_data, writing_rules)`,generate_table:`def generate_table(columns, rows, rules):\n    # 설계 전용: 현재 실행하지 않음\n    return {"columns": columns, "rows": rows, "rules": rules}`,generate_image_spec:`def generate_image_spec(item, architecture, flow_type):\n    return llm.json("image_spec", item, architecture, flow_type)`,validate_section:`def validate_section(section_spec, content, source_data):\n    return rubric.check(section_spec, content, source_data)`,assemble_document:`def assemble_document(sections, tables, images):\n    return hwp.compose(sections, tables, images)`};
