<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="S-Brain 웹 백엔드 구조도: 브라우저에서 nginx, 웹 백엔드, 조율 함수, MySQL, 워커, 외부 서비스, S3로 이어지는 흐름">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0B6E6E"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#6B7280"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="620" rx="20" fill="#F8FAF9"/>
  <g font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" fill="#151C2C">
    <text x="40" y="38" font-size="22" font-weight="700">S-Brain 전체 구조 — 이 README의 대상은 초록색 칸(웹 백엔드)</text>

    <!-- Row 1 -->
    <rect x="40" y="70" width="200" height="90" rx="14" fill="#FFFFFF" stroke="#C9D1CE" stroke-width="2"/>
    <text x="140" y="108" font-size="20" font-weight="700" text-anchor="middle">브라우저</text>
    <text x="140" y="136" font-size="15" fill="#4B5563" text-anchor="middle">React (Vite) 화면</text>

    <rect x="300" y="70" width="200" height="90" rx="14" fill="#FFFFFF" stroke="#C9D1CE" stroke-width="2"/>
    <text x="400" y="108" font-size="20" font-weight="700" text-anchor="middle">nginx</text>
    <text x="400" y="136" font-size="15" fill="#4B5563" text-anchor="middle">HTTPS · /api → 백엔드</text>

    <rect x="560" y="55" width="280" height="130" rx="16" fill="#E3F1F0" stroke="#0B6E6E" stroke-width="4"/>
    <text x="700" y="92" font-size="21" font-weight="800" text-anchor="middle" fill="#0B6E6E">웹 백엔드 (FastAPI)</text>
    <text x="700" y="122" font-size="15" text-anchor="middle">구글 로그인 · 입력 검사</text>
    <text x="700" y="145" font-size="15" text-anchor="middle">문서 출력 (docx · PDF · hwp · zip)</text>
    <text x="700" y="168" font-size="15" text-anchor="middle">관리자 API · 요청 로그</text>

    <rect x="900" y="70" width="260" height="90" rx="14" fill="#FFFFFF" stroke="#C9D1CE" stroke-width="2"/>
    <text x="1030" y="108" font-size="20" font-weight="700" text-anchor="middle">조율 함수</text>
    <text x="1030" y="136" font-size="15" fill="#4B5563" text-anchor="middle">시작 요청 · 상태 조회 · 명령</text>

    <!-- Row 2 -->
    <rect x="560" y="270" width="280" height="90" rx="14" fill="#FFFFFF" stroke="#C9D1CE" stroke-width="2"/>
    <text x="700" y="308" font-size="20" font-weight="700" text-anchor="middle">S3 (산출물 파일)</text>
    <text x="700" y="336" font-size="15" fill="#4B5563" text-anchor="middle">웹은 읽기만, 쓰기는 워커</text>

    <rect x="900" y="270" width="260" height="90" rx="14" fill="#FFFFFF" stroke="#C9D1CE" stroke-width="2"/>
    <text x="1030" y="308" font-size="20" font-weight="700" text-anchor="middle">MySQL (RDS)</text>
    <text x="1030" y="336" font-size="15" fill="#4B5563" text-anchor="middle">웹 표 + orch_ 표 (공유)</text>

    <!-- Row 3 -->
    <rect x="40" y="470" width="460" height="90" rx="14" fill="#FFFFFF" stroke="#C9D1CE" stroke-width="2"/>
    <text x="270" y="508" font-size="20" font-weight="700" text-anchor="middle">외부 서비스</text>
    <text x="270" y="536" font-size="15" fill="#4B5563" text-anchor="middle">OpenAI API · 공고 서버 · KIET 시장 자료</text>

    <rect x="560" y="470" width="280" height="90" rx="14" fill="#FFFFFF" stroke="#C9D1CE" stroke-width="2"/>
    <text x="700" y="508" font-size="20" font-weight="700" text-anchor="middle">워커 + Agent</text>
    <text x="700" y="536" font-size="15" fill="#4B5563" text-anchor="middle">단계를 실제로 실행하는 프로세스</text>

    <!-- Connectors (solid = call, dashed = read-only) -->
    <g stroke="#0B6E6E" stroke-width="3" fill="none">
      <line x1="240" y1="115" x2="296" y2="115" marker-end="url(#ah)"/>
      <line x1="500" y1="115" x2="556" y2="115" marker-end="url(#ah)"/>
      <line x1="840" y1="115" x2="896" y2="115" marker-end="url(#ah)"/>
      <line x1="1030" y1="160" x2="1030" y2="266" marker-end="url(#ah)"/>
      <line x1="840" y1="515" x2="1030" y2="515"/>
      <line x1="1030" y1="515" x2="1030" y2="364" marker-start="url(#ah)" marker-end="url(#ah)"/>
      <line x1="700" y1="470" x2="700" y2="364" marker-end="url(#ah)"/>
      <line x1="560" y1="515" x2="504" y2="515" marker-end="url(#ah)"/>
    </g>
    <line x1="700" y1="185" x2="700" y2="266" stroke="#6B7280" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#ahg)"/>

    <!-- Labels -->
    <g font-size="14" fill="#374151">
      <text x="268" y="102" text-anchor="middle">요청</text>
      <text x="528" y="102" text-anchor="middle">/api</text>
      <text x="868" y="102" text-anchor="middle">호출</text>
      <text x="1042" y="218">저장 · 읽기</text>
      <text x="712" y="232" fill="#4B5563">읽기 전용</text>
      <text x="712" y="425">파일 쓰기</text>
      <text x="1042" y="440">일 가져가기 · 결과 저장</text>
      <text x="532" y="502" text-anchor="middle">호출</text>
    </g>

    <!-- Legend -->
    <g font-size="14" fill="#374151">
      <line x1="40" y1="598" x2="80" y2="598" stroke="#0B6E6E" stroke-width="3"/>
      <text x="90" y="603">실선 = 호출 · 저장</text>
      <line x1="260" y1="598" x2="300" y2="598" stroke="#6B7280" stroke-width="3" stroke-dasharray="9 7"/>
      <text x="310" y="603">점선 = 읽기 전용</text>
    </g>
  </g>
</svg>
